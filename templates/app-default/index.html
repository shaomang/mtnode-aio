<!doctype html>
<!-- 新建应用的默认页（Hello world）：一个基于 Markdown 的欢迎页，用来告诉零基础用户
     「在会话栏说一句话，这个页面就会变成你要的样子」。
     纯静态、单文件、离线可用：正文是 <script type="text/markdown"> 里的真 Markdown，
     由页内一段极小渲染器画出来；不依赖宿主能力也能正常显示。
     本文件是**模板**，主进程 apps-store.js 写入应用目录时替换两个占位符：
       {{APP_NAME}} · {{STYLE}}（风格 id，见 templates/app-default/styles/*.css）
     风格系统与契约见同目录 STYLES.md（一份 base.css + 每套风格一份 styles/<id>.css）。
     注入后整页仍是单文件自包含（样式内联），所以没有额外的相对资源要跟着复制。 -->
<html lang="zh-CN" data-style="{{STYLE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{APP_NAME}}</title>
    <!-- {{STYLE_CSS}}：base.css + styles/<style>.css 在这里内联进来（保持单文件） -->
    <style>
      {{STYLE_CSS}}

      /* ── 底部语音听写（本页脚注里的那一小条 + 结果小窗）──
         颜色只取语义变量（--line / --ink2 / --accent-dim …），换风格自动跟随；
         上面的 {{STYLE_CSS}} 先落地，这里的规则按需覆盖。 */
      .foot {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .foot-line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dict {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dict-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        position: relative;
      }
      .dict-btn:hover:not(:disabled) {
        border-color: var(--accent-dim);
        color: var(--accent-dim);
      }
      .dict-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .dict-btn.is-rec::after {
        content: "";
        position: absolute;
        left: 2px;
        bottom: 1px;
        height: 2px;
        width: var(--level, 4%);
        border-radius: 2px;
        background: var(--accent-dim);
        transition: width 0.08s linear;
      }
      .dict-note {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
        color: var(--ink2);
      }
      .dict-note[data-kind="warn"] {
        color: var(--warn, #f0b34a);
      }
      .dict-note[data-kind="ok"] {
        color: var(--accent-dim);
      }
      .dict-panel {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 84px;
        width: min(720px, calc(100vw - 48px));
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        color: var(--ink, inherit);
        font-size: 12.5px;
      }
      .dict-panel[hidden] {
        display: none;
      }
      .dict-panel-h {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dict-panel-meta {
        color: var(--ink2);
        font-size: 11.5px;
      }
      .dict-x {
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ink2);
        cursor: pointer;
        padding: 1px 6px;
        font: inherit;
      }
      .dict-panel-body {
        max-height: 26vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.7;
      }
      .dict-panel-f {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
              <circle cx="4" cy="9" r="2.2" />
              <circle cx="13.6" cy="4.2" r="2.2" />
              <circle cx="13.6" cy="13.8" r="2.2" />
              <path d="M6 8.2 11.5 5.1M6 9.8l5.5 3.1" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-name">{{APP_NAME}}</span>
        </div>
        <div class="bar-actions">
          <button type="button" class="chip" id="langBtn" aria-pressed="false">EN</button>
          <button type="button" class="x" id="closeBtn" hidden>
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M2 2l8 8M10 2l-8 8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <main class="page" id="page"></main>

      <footer class="foot">
        <!-- 底部语音听写：话筒 = 本机内置语音识别（官方本地 SenseVoice，跑在 MTNode 的 dsh
             运行时里，首次使用自动下载权重）；右边一枚把本机音频文件转成文字。
             结果只展示 + 一键复制，不自动往页面里塞。 -->
        <div class="dict">
          <button type="button" class="dict-btn" data-act="mic" title="点一下开始听，再点一下结束">🎤<span data-lang="zh">听写</span><span data-lang="en">Dictate</span></button>
          <button type="button" class="dict-btn" data-act="file" title="选一个音频文件转成文字">🎧<span data-lang="zh">音频转文字</span><span data-lang="en">Audio → text</span></button>
          <span class="dict-note"></span>
        </div>
        <div class="foot-line">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <path d="M6 1v9M2.5 7 6 10.5 9.5 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="footText"></span>
        </div>
      </footer>
    </div>

    <!-- 听写结果小窗（展示 + 一键复制；不自动插入页面控件） -->
    <div id="dictPanel" class="dict-panel" hidden>
      <div class="dict-panel-h">
        <b><span data-lang="zh">识别结果</span><span data-lang="en">Transcript</span></b>
        <span class="dict-panel-meta"></span>
        <button type="button" class="dict-x" data-act="close" aria-label="关闭">✕</button>
      </div>
      <div class="dict-panel-body"></div>
      <div class="dict-panel-f">
        <button type="button" class="dict-btn" data-act="copy"><span data-lang="zh">复制</span><span data-lang="en">Copy</span></button>
      </div>
    </div>

    <!-- 正文：真 Markdown（中 / 英两块，按界面语言选一块渲染） -->
    <script type="text/markdown" data-lang="zh">
# 你的应用，从这句话开始

在 MTNode「应用中心 → 开发」的**会话栏**里写下你想要什么 —— 这个页面就会变成你要的样子。

1. **说一句就行**：比如「做一个便签墙，能加、能删、能保存」。
2. **马上看到变化**：说完这一句，这个页面会自己刷新成新的样子。
3. **不满意就继续说**：「标题大一点」「换成浅色」「加个搜索框」，一轮一轮改到满意。

> 不用写代码，也不用看懂任何技术名词。
    </script>

    <script type="text/markdown" data-lang="en">
# Your app starts with one sentence

Write what you want in the **chat box** under App Center → Develop, and this page becomes it.

1. **One sentence is enough**: for example, “a sticky-note wall I can add to, delete from and keep”.
2. **Watch it change**: once you send that sentence, this page reloads itself into the new version.
3. **Keep talking**: “a bigger title”, “a light theme”, “add a search box” — round by round, until it fits.

> No code, and no technical vocabulary needed.
    </script>

    <script>
      (function () {
        "use strict";

        /* ── 极小 Markdown 渲染器（块 + 行内语义子集，够改写这页正文用） ── */
        function esc(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function inline(s) {
          let t = esc(s);
          t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
          t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          t = t.replace(/(^|[\s(])\*([^*]+)\*/g, "$1<em>$2</em>");
          t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
          return t;
        }
        function render(md) {
          const src = String(md == null ? "" : md).replace(/\r\n?/g, "\n").replace(/^\n+|\s+$/g, "");
          const out = [];
          let list = null; /* "ol" | "ul" */
          let fence = false; /* 代码围栏开着？ */
          const closeList = () => {
            if (list) {
              out.push("</" + list + ">");
              list = null;
            }
          };
          for (const raw of src.split("\n")) {
            const line = raw.replace(/\s+$/, "");
            /* 代码围栏先判：围栏里整行照抄（只转义），不当 Markdown 解析；
               空白行也要留着，不然代码块会被压成一行 */
            if (/^```/.test(line)) {
              closeList();
              out.push(fence ? "</code></pre>" : "<pre><code>");
              fence = !fence;
              continue;
            }
            if (fence) {
              out.push(esc(raw));
              continue;
            }
            if (/^\s*$/.test(line)) {
              closeList();
              continue;
            }
            let m;
            if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
              closeList();
              const lv = m[1].length;
              out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">");
              continue;
            }
            if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
              closeList();
              out.push("<hr />");
              continue;
            }
            if ((m = line.match(/^\s*>\s?(.*)$/))) {
              closeList();
              out.push("<blockquote>" + inline(m[1]) + "</blockquote>");
              continue;
            }
            if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))) {
              if (list !== "ol") {
                closeList();
                out.push('<ol class="steps">');
                list = "ol";
              }
              out.push("<li>" + inline(m[2]) + "</li>");
              continue;
            }
            if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
              if (list !== "ul") {
                closeList();
                out.push("<ul>");
                list = "ul";
              }
              out.push("<li>" + inline(m[1]) + "</li>");
              continue;
            }
            closeList();
            out.push("<p>" + inline(line) + "</p>");
          }
          closeList();
          if (fence) out.push("</code></pre>"); /* 围栏没关（写漏了）也要收口 */
          return out.join("\n");
        }

        /* ── 语言：按系统语言选一块，右上角可手动切 ── */
        const blocks = {};
        document.querySelectorAll('script[type="text/markdown"]').forEach((el) => {
          blocks[el.dataset.lang || ""] = el.textContent || "";
        });
        /* 底部这条 = 把视线直接交给下面的会话栏（不说「应用中心 / 目录」这类内部话） */
        const foot = {
          zh: "说第一句就会变成你的应用 · 内容存在 <数据目录>\\apps-data\\<应用名>\\，在应用里可改",
          en: "One sentence turns it into your app · data lives in <data dir>\\apps-data\\<app>, changeable in the app",
        };
        const params = new URLSearchParams(location.search || "");
        const forced = params.get("lang");
        let langs = [];
        try {
          langs = JSON.parse(sessionStorage.getItem("mtnode-app-lang") || "null") || [];
        } catch (_) {}
        let lang =
          forced === "zh" || forced === "en"
            ? forced
            : langs[0] === "zh" || langs[0] === "en"
              ? langs[0]
              : /^zh\b|^zh-/i.test(navigator.language || "") || /^zh/i.test(navigator.language || "")
                ? "zh"
                : "en";

        const page = document.getElementById("page");
        const langBtn = document.getElementById("langBtn");
        const footText = document.getElementById("footText");

        function paint() {
          page.innerHTML = render(blocks[lang] || blocks.zh || "");
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          document.title = (blocks[lang] || "").match(/^#\s+(.+)$/m)?.[1] || "{{APP_NAME}}";
          footText.textContent = foot[lang] || foot.zh;
          langBtn.textContent = lang === "zh" ? "EN" : "中";
          langBtn.title = lang === "zh" ? "Switch to English" : "切换到中文";
          langBtn.setAttribute("aria-label", langBtn.title);
          langBtn.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
          try {
            sessionStorage.setItem("mtnode-app-lang", JSON.stringify([lang]));
          } catch (_) {}
        }

        langBtn.onclick = () => {
          lang = lang === "zh" ? "en" : "zh";
          paint();
        };

        /* 截图 / 录屏时把入场动画按住（?still=1），别让元素停在动画中途 */
        if (params.get("still") === "1") document.body.classList.add("still");

        /* 关自己窗口：只有宿主在的时候才给按钮（没有桥就不假装能关） */
        const closeBtn = document.getElementById("closeBtn");
        const host = window.appHost || null;
        if (host && typeof host.close === "function") {
          closeBtn.hidden = false;
          closeBtn.title = lang === "zh" ? "关闭" : "Close";
          closeBtn.setAttribute("aria-label", closeBtn.title);
          closeBtn.onclick = () => host.close();
        }

        /* ── 底部语音听写（本机内置语音识别：官方本地 SenseVoice，跑在 MTNode 的 dsh 运行时里）──
           能力全在 window.appHost（preload-app.js）：pickAudio / transcribe / transcribeWav /
           asrStatus / asrPrepare / onSpeechState。桥缺席（浏览器直接打开这一页）时整块禁用并
           写清原因 —— 不假装能用。麦克风采集在本页做：16 kHz 单声道 PCM16 WAV → base64 → 转写，
           整形口径与宿主一致。识别结果只展示 + 一键复制，不自动往页面里塞。 */
        const dict = (() => {
          const bar = document.querySelector(".dict");
          if (!bar) return null;
          const btnMic = bar.querySelector('[data-act="mic"]');
          const btnFile = bar.querySelector('[data-act="file"]');
          const note = bar.querySelector(".dict-note");
          const panel = document.getElementById("dictPanel");
          const pBody = panel.querySelector(".dict-panel-body");
          const pMeta = panel.querySelector(".dict-panel-meta");
          const SR = 16000;
          const SIL_MS = 1500;
          const SIL_RMS = 0.012;
          const MAX_SEC = 120;
          let busy = false;
          let stopFn = null;
          let lastText = "";

          const canFile = !!(host && host.pickAudio && host.transcribe);
          const canWav = !!(host && host.transcribeWav);
          const canMic =
            canWav &&
            typeof navigator !== "undefined" &&
            !!navigator.mediaDevices &&
            !!navigator.mediaDevices.getUserMedia;

          const say = (msg, kind) => {
            note.textContent = msg || "";
            note.dataset.kind = kind || "";
          };
          const show = (text, meta) => {
            lastText = String(text || "");
            pBody.textContent = lastText || (lang === "zh" ? "（没有识别到文字）" : "(nothing recognized)");
            pMeta.textContent = meta || "";
            panel.hidden = false;
          };
          const setBusy = (on, label) => {
            busy = !!on;
            btnMic.disabled = busy || !canMic;
            btnFile.disabled = busy || !canFile;
            if (label) say(label, "");
          };

          function encodeWav(pcm) {
            const n = pcm.length;
            const buf = new ArrayBuffer(44 + n * 2);
            const v = new DataView(buf);
            const str = (off, s) => {
              for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i));
            };
            str(0, "RIFF");
            v.setUint32(4, 36 + n * 2, true);
            str(8, "WAVE");
            str(12, "fmt ");
            v.setUint32(16, 16, true);
            v.setUint16(20, 1, true);
            v.setUint16(22, 1, true);
            v.setUint32(24, 16000, true);
            v.setUint32(28, 32000, true);
            v.setUint16(32, 2, true);
            v.setUint16(34, 16, true);
            str(36, "data");
            v.setUint32(40, n * 2, true);
            let off = 44;
            for (let i = 0; i < n; i++, off += 2) {
              let s = pcm[i];
              s = s > 1 ? 1 : s < -1 ? -1 : s;
              v.setInt16(off, s < 0 ? Math.round(s * 32768) : Math.round(s * 32767), true);
            }
            return new Uint8Array(buf);
          }
          function to16k(floatBuf, rate) {
            const step = rate / SR;
            const len = Math.max(0, Math.round(floatBuf.length / step));
            const out = new Int16Array(len);
            for (let i = 0; i < len; i++) {
              const pos = i * step;
              const i0 = Math.floor(pos);
              const i1 = Math.min(floatBuf.length - 1, i0 + 1);
              const f = pos - i0;
              let x = (floatBuf[i0] || 0) * (1 - f) + (floatBuf[i1] || 0) * f;
              x = x > 1 ? 1 : x < -1 ? -1 : x;
              out[i] = x < 0 ? Math.round(x * 32768) : Math.round(x * 32767);
            }
            return out;
          }
          function b64(bytes) {
            let s = "";
            for (let i = 0; i < bytes.length; i += 0x8000)
              s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(bytes.length, i + 0x8000)));
            return btoa(s);
          }

          /* 模型没就绪就先把下载跑起来（幂等），但不拦住用户：采完直接转写 */
          function ensureReady() {
            if (!host || !host.asrStatus) return Promise.resolve(null);
            return host
              .asrStatus()
              .then((st) => {
                if (st && (st.ready || st.downloading)) {
                  if (st.downloading) {
                    const pct = st.totalBytes ? Math.round((st.completedBytes / st.totalBytes) * 100) : 0;
                    say(
                      (lang === "zh" ? "正在下载语音模型" : "Downloading speech model") + (pct ? " " + pct + "%" : "…"),
                      "",
                    );
                  }
                  return st;
                }
                setBusy(true, lang === "zh" ? "正在准备语音模型（首次使用约 239MB）…" : "Preparing the speech model (≈239MB)…");
                return host.asrPrepare ? host.asrPrepare({}) : st;
              })
              .catch(() => null);
          }
          function report(r) {
            if (!r) return;
            if (r.ok) {
              show(r.text, r.audioSeconds ? Math.round(r.audioSeconds) + "s" : "");
              say(lang === "zh" ? "识别完成" : "Done", "ok");
            } else if (r.code === "cancelled") {
              /* 用户自己取消：不提示 */
            } else {
              say(String(r.error || (lang === "zh" ? "识别失败" : "Failed")), "warn");
            }
          }
          function record() {
            return new Promise((resolve) => {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) {
                resolve({ ok: false, error: lang === "zh" ? "本机不支持 Web Audio" : "Web Audio unsupported" });
                return;
              }
              navigator.mediaDevices
                .getUserMedia({ audio: true })
                .then((stream) => {
                  const ac = new AC();
                  const src = ac.createMediaStreamSource(stream);
                  const node = ac.createScriptProcessor(4096, 1, 1);
                  const rate = ac.sampleRate || 48000;
                  const parts = [];
                  let total = 0;
                  let lastVoice = Date.now();
                  const started = Date.now();
                  let done = false;
                  const cleanup = () => {
                    try { node.disconnect(); } catch (_) {}
                    try { src.disconnect(); } catch (_) {}
                    try { ac.close(); } catch (_) {}
                    try { stream.getTracks().forEach((t) => t.stop()); } catch (_) {}
                  };
                  const finish = (why) => {
                    if (done) return;
                    done = true;
                    cleanup();
                    stopFn = null;
                    if (!total) {
                      resolve({ ok: false, error: lang === "zh" ? "没有录到声音" : "Nothing recorded" });
                      return;
                    }
                    const all = new Int16Array(total);
                    let off = 0;
                    parts.forEach((p) => {
                      all.set(p, off);
                      off += p.length;
                    });
                    resolve({ ok: true, pcm: all, why });
                  };
                  node.onaudioprocess = (ev) => {
                    if (done) return;
                    const ch = ev.inputBuffer.getChannelData(0);
                    let rms = 0;
                    for (let i = 0; i < ch.length; i += 8) rms += ch[i] * ch[i];
                    rms = Math.sqrt(rms / Math.max(1, Math.ceil(ch.length / 8)));
                    btnMic.style.setProperty("--level", String(Math.round(Math.min(1, rms * 6) * 100) + "%"));
                    const pcm = to16k(new Float32Array(ch), rate);
                    parts.push(pcm);
                    total += pcm.length;
                    if (rms >= SIL_RMS) lastVoice = Date.now();
                    if (Date.now() - started > 1200 && Date.now() - lastVoice > SIL_MS) finish("silence");
                    else if (Date.now() - started > MAX_SEC * 1000) finish("limit");
                  };
                  src.connect(node);
                  node.connect(ac.destination);
                  stopFn = () => finish("manual");
                })
                .catch((err) => {
                  const raw = String((err && err.name) || "") + " " + String((err && err.message) || "");
                  resolve({
                    ok: false,
                    error: /NotAllowed|Permission|denied/i.test(raw)
                      ? lang === "zh"
                        ? "麦克风权限被拒绝（到系统设置里允许本应用使用麦克风）"
                        : "Microphone permission denied"
                      : lang === "zh"
                        ? "麦克风没能启动（检查系统输入设备与权限）"
                        : "Microphone failed to start",
                  });
                });
            });
          }

          btnFile.onclick = () => {
            if (busy) return;
            setBusy(true, lang === "zh" ? "正在转写音频…" : "Transcribing audio…");
            ensureReady()
              .then(() => host.pickAudio())
              .then((r) => {
                if (!r || !r.ok) return r || { ok: false, code: "cancelled" };
                say(lang === "zh" ? "正在识别…" : "Recognizing…", "");
                return host.transcribe({ path: r.path });
              })
              .then((r) => report(r))
              .catch((e) => report({ ok: false, error: String((e && e.message) || e) }))
              .then(() => setBusy(false));
          };
          btnMic.onclick = () => {
            if (stopFn) {
              const f = stopFn;
              stopFn = null;
              f();
              return;
            }
            if (busy) return;
            setBusy(true, lang === "zh" ? "正在听…（说完停 1.5 秒自动结束）" : "Listening… (stops after 1.5s of silence)");
            btnMic.classList.add("is-rec");
            ensureReady()
              .then(() => record())
              .then((r) => {
                btnMic.classList.remove("is-rec");
                btnMic.style.removeProperty("--level");
                if (!r || !r.ok) {
                  report(r);
                  setBusy(false);
                  return null;
                }
                say(lang === "zh" ? "正在识别…" : "Recognizing…", "");
                return host.transcribeWav(b64(encodeWav(r.pcm))).then((out) => {
                  report(out);
                  setBusy(false);
                });
              })
              .catch((e) => {
                btnMic.classList.remove("is-rec");
                report({ ok: false, error: String((e && e.message) || e) });
                setBusy(false);
              });
          };
          panel.querySelector('[data-act="close"]').onclick = () => {
            panel.hidden = true;
          };
          panel.querySelector('[data-act="copy"]').onclick = () => {
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastText);
              else {
                const ta = document.createElement("textarea");
                ta.value = lastText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
              }
              say(lang === "zh" ? "已复制" : "Copied", "ok");
            } catch (e) {
              say(lang === "zh" ? "复制失败（手动选中再复制）" : "Copy failed", "warn");
            }
          };
          /* 状态：没能力就说清为什么，不假装能用 */
          if (!host) {
            say(lang === "zh" ? "语音转写不可用：当前不在 MTNode 窗口里" : "Speech unavailable outside MTNode", "warn");
            btnMic.disabled = true;
            btnFile.disabled = true;
          } else if (host.asrStatus) {
            host.asrStatus().then((st) => {
              if (!st || st.ok === false) {
                say(lang === "zh" ? "语音服务不可用" : "Speech service unavailable", "warn");
                return;
              }
              if (st.ready) say(lang === "zh" ? "语音识别就绪" : "Speech ready", "ok");
              else if (st.downloading) say(lang === "zh" ? "正在下载语音模型…" : "Downloading speech model…", "");
              else say(lang === "zh" ? "语音模型尚未下载（首次识别会自动下载）" : "Model downloads on first use", "");
            });
            if (host.onSpeechState)
              host.onSpeechState(() => {
                /* 进度事件来了就现读一次（口径与 speech.js 一致） */
                host.asrStatus().then((st) => {
                  if (!st || !st.downloading) return;
                  const pct = st.totalBytes ? Math.round((st.completedBytes / st.totalBytes) * 100) : 0;
                  say(
                    (lang === "zh" ? "正在下载语音模型" : "Downloading speech model") + (pct ? " " + pct + "%" : "…"),
                    "",
                  );
                });
              });
          }
          if (!canMic) btnMic.disabled = true;
          if (!canFile) btnFile.disabled = true;
          const api = {
            /* 给应用自己用：直接拿本机音频转文字（不进 footer 的界面流程） */
            file: () => host.pickAudio().then((r) => (r && r.ok ? host.transcribe({ path: r.path }) : r)),
            wav: (b) => host.transcribeWav(String(b || "")),
            status: () => host.asrStatus(),
            prepare: (o) => (host.asrPrepare ? host.asrPrepare(o || {}) : Promise.resolve(null)),
            text: () => lastText,
          };
          /* 也挂到 window 上：开发会话改写这页时可以照旧用它（例子见文件头的接口说明） */
          window.MTNDictate = api;
          return api;
        })();

        paint();
      })();
    </script>
  </body>
</html>
