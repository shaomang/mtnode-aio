<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Console · Breeze TTS 2</title>
<link rel="stylesheet" href="../../plugins/plugin-kit.css" />
<style>
/* 纯日志窗：配色与日志区一律取 plugins/plugin-kit.css 的令牌与日志窗口径
   （.pk-log-head 的小字标题条 + .pk-log 的深底等宽滚动区）；只在本地留布局。 */
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:12px/1.5 var(--sans)}
body{display:flex;flex-direction:column;padding:8px;gap:6px;overflow:hidden}
#bar{padding:4px 2px;display:flex;gap:8px;align-items:center;flex:0 0 auto;font-size:11px;color:var(--muted)}
#bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
#log{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;word-break:break-all;tab-size:2;
  background:var(--code);border:1px solid var(--bd);border-radius:var(--r-md);padding:8px 10px;
  color:color-mix(in srgb,var(--ink) 86%,var(--muted));font:12px/1.55 var(--mono)}
button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:var(--r-sm);
  padding:4px 8px;cursor:pointer;font:11px/1 var(--sans);
  transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
button:hover{border-color:var(--bd);background:var(--panel2);color:var(--ink)}
.err{color:color-mix(in srgb,var(--red) 85%,var(--ink))}
.warn{color:var(--yellow)}
.ok{color:var(--green)}
</style>
</head>
<body>
<div id="bar"><span id="path">—</span><button id="btnClear">清空</button></div>
<div id="log"></div>
<script src="console-panel.js"></script>
</body>
</html>
