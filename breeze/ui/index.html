<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Breeze TTS 2 本地 TTS</title>
<link rel="stylesheet" href="../../plugins/plugin-kit.css" />
<style>
/* 配色与控件一律取 plugins/plugin-kit.css 的令牌（--bg / --panel / --panel2 /
   --ink / --muted / --bd / --orange / --cyan / --green / --red / --yellow），
   本文件只留布局：蓝紫-青绿调色板已全部换成 kit 的橙（动作）+ 青（信息 / 选中）。 */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 var(--sans);overflow-y:auto}
.wrap{display:flex;flex-direction:column;gap:10px;padding:12px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:15px;margin:0;font-weight:600;color:var(--ink)}
.spacer{flex:1}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--bd2);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;font:inherit;
  transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
button:hover:not(:disabled){border-color:var(--bd2);background:color-mix(in srgb,var(--panel2) 70%,var(--ink) 8%)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{border-color:color-mix(in srgb,var(--orange) 55%,var(--bd2));background:color-mix(in srgb,var(--orange) 18%,var(--panel2));color:var(--orange2);font-weight:600}
button.primary:hover:not(:disabled){border-color:var(--orange);background:color-mix(in srgb,var(--orange) 26%,var(--panel2));color:var(--orange2)}
button.danger{border-color:color-mix(in srgb,var(--red) 45%,var(--bd2));background:transparent;color:color-mix(in srgb,var(--red) 78%,var(--ink))}
button.danger:hover:not(:disabled){border-color:var(--red);background:var(--tint-red);color:color-mix(in srgb,var(--red) 88%,var(--ink))}
button.mini{padding:3px 8px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:12px;margin:0;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.path{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;flex:1;min-width:0}
input[type=text],input[type=number],textarea,select{background:var(--code);color:var(--ink);border:1px solid var(--bd2);border-radius:var(--r-sm);padding:5px 7px;font:inherit;min-width:0}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
textarea{resize:vertical;font-family:inherit}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd2);background:var(--panel2);color:var(--muted)}
.badge.on{border-color:color-mix(in srgb,var(--green) 40%,var(--bd));background:var(--tint-green);color:var(--green)}
.badge.off{color:var(--muted)}
.badge.load{border-color:color-mix(in srgb,var(--yellow) 40%,var(--bd));background:var(--tint-yellow);color:var(--yellow)}
.meta{font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.item{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--r-sm);padding:5px 7px}
.item.sel{border-color:var(--cyan);background:var(--tint-cyan)}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:11px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:11px;color:var(--muted);padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
/* 角色预设的界面在画布节点里（三步向导），控制台只留状态 / 日志 / 手写指令试听 */
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
audio{width:100%;height:32px}
/* 日志区 = kit 的日志窗口径（.pk-log）：深底 + 等宽 + 自动换行 */
#log,#engLog{font-family:var(--mono);font-size:12px;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--muted));
  background:var(--code);border:1px solid var(--bd);border-radius:var(--r-md);padding:8px 10px;
  height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;tab-size:2}
#engLog{height:120px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--bd2);border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none !important}
.kv{display:flex;gap:6px;font-size:11px}
.kv b{color:var(--muted);font-weight:400;min-width:64px}
.kv span{font-family:var(--mono);word-break:break-all}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--bd2);border-radius:var(--r-md);padding:7px 14px;font-size:12px;box-shadow:var(--shadow-pop);z-index:99;max-width:90%}
.toast.err{border-color:var(--red);background:var(--tint-red);color:color-mix(in srgb,var(--red) 85%,var(--ink))}
.toast.ok{border-color:var(--green);background:var(--tint-green);color:var(--green)}
.toast.warn{border-color:var(--yellow);background:var(--tint-yellow);color:var(--yellow)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>Breeze TTS 2</h1>
    <span class="badge" id="verBadge">v1.0.0</span>
    <span class="spacer"></span>
    <button class="mini" id="btnLogPanel" title="并排打开日志窗">日志窗</button>
    <button class="mini" id="btnRefresh" title="刷新状态">刷新</button>
  </div>

  <div class="card">
    <div class="row">
      <span class="badge off" id="svcBadge">未运行</span>
      <span class="badge" id="engBadge">引擎未知</span>
      <span class="spacer"></span>
      <button class="mini primary" id="btnStart">启用</button>
      <button class="mini danger" id="btnStop">停止</button>
    </div>
    <div class="row">
      <button class="mini" id="btnEngineStart">加载模型</button>
      <button class="mini" id="btnEngineStop">卸载模型</button>
      <label class="meta" title="官方推荐的最优配置：CUDA Graph + 预热，RTF 与首包延迟都明显低于 eager；冷启动更久、约 14.4GB 显存。默认关（显存容易被占满，需要时手动打开）；显存不足或卡被其它任务占着时，后端自动回退 eager。">
        <input type="checkbox" id="fastAll" /> fast 路径（默认关）
      </label>
    </div>
    <div class="kv"><b>管理服务</b><span id="apiBase">—</span></div>
    <div class="kv"><b>API Key</b><span id="apiKey">—</span></div>
    <div class="kv"><b>推理引擎</b><span id="engineInfo">—</span></div>
    <div class="kv"><b>显存</b><span id="gpuInfo">—</span></div>
    <div class="row">
      <button class="mini" id="btnEngLog" title="引擎进程的最近日志：权重加载进度与报错现场">引擎日志</button>
    </div>
    <div id="engLogBox" class="hide"><div id="engLog"></div></div>
  </div>

  <div class="card">
    <div class="row">
      <span class="meta">角色（音色预设）在画布节点里建：点节点上的 👤 角色 → 三步向导（声线设定 → 候选挑选 → 基础音色），
        建好的角色存在预设库里，任何画布都能选。这个控制台只负责后端启停、日志，以及手写指令的临时试听。</span>
    </div>
  </div>

  <div class="card">
    <label class="f">正文（中文内联事件用方括号：[笑] [咳嗽] [清嗓子] [叹气]；英文用圆括号：(laugh) …）
      <textarea id="ttsText" rows="3" placeholder="[叹气] 没想到过了这么久，你还记得我的声音。"></textarea>
    </label>
    <label class="f" title="音色设计靠它描述音色：性别年龄 / 音色质感 / 语速节奏 / 情绪性格 / 场景用途">
      指令（必填 · 临时试听用，不写进角色）
      <textarea id="ttsInstr" rows="3" placeholder="三十岁出头的女声，音色偏暖，语速慢，适合深夜电台。"></textarea>
    </label>
    <div class="grid2">
      <label class="f">cfg_scale（音色设计官方建议 4）
        <input type="number" id="cfgScale" value="4" min="0.1" max="10" step="0.1" />
      </label>
      <label class="f">seed（同种子可复现）<input type="number" id="seed" value="1" step="1" /></label>
    </div>
    <div class="row">
      <button class="mini primary" id="btnSynth">合成试听</button>
      <span class="meta" id="synthInfo">—</span>
    </div>
    <audio id="outAudio" controls></audio>
  </div>

  <div class="card">
    <div id="log"></div>
    <div class="row">
      <button class="mini" id="btnClearLog" title="清空日志文件（真删除，不只是清显示）">清空日志</button>
      <span class="meta" id="logPath">—</span>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
