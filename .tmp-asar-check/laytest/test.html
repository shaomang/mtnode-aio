<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:100%;background:#151517;color:#ebedf2;font-family:sans-serif}
.layout{flex:1;display:flex;min-height:0;position:relative;height:100vh}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;flex:1}
.agent-pane{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 0px;overflow:hidden;background:#151517}
.agent-side{min-width:0;overflow:hidden;display:flex;flex-direction:column;background:#1b1b1c;border-right:1px solid rgba(255,255,255,.06)}
.agent-side-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px}
.agent-side-logo{flex:1;font-size:14px;font-weight:600;letter-spacing:.5px;color:#ebedf2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-side-new{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#ebedf2;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 12px;cursor:pointer}
.agent-side-search{flex:none;padding:4px 14px 10px}
.agent-side-search input{width:100%;box-sizing:border-box;background:#151517;color:#ebedf2;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;font-size:13px;outline:none}
.agent-side-list{flex:1;min-height:0;overflow:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:1px}
.agent-side-foot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.06)}
.agent-side-region{flex:1;font-size:11px;color:rgb(129,133,140)}
.agent-main{min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#151517}
.side-sess{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;font-size:13px;color:#ebedf2;background:rgba(255,255,255,.04)}
</style></head><body>
<div class="layout"><section class="pane">
<div class="agent-pane" id="agentPane">
<aside class="agent-side">
<div class="agent-side-head"><span class="agent-side-logo">DeepSeek Harness</span><button class="agent-side-new">＋ 新会话</button></div>
<div class="agent-side-search"><input placeholder="搜索会话…"></div>
<div class="agent-side-list" id="agentSideList"></div>
<div class="agent-side-foot"><span class="agent-side-region">DeepSeek Harness · <span>预览版</span></span><button id="btnAssistAgent" style="flex:none;width:28px;height:28px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:transparent;color:#ebedf2;cursor:pointer">✦</button></div>
</aside>
<div class="agent-main"><div style="padding:20px;color:#888">chat area</div></div>
</div>
</section></div>
<script>
const L = document.getElementById("agentSideList");
for (let i=0;i<8;i++){ const d=document.createElement("div"); d.className="side-sess"; d.textContent="会话 "+(i+1); L.appendChild(d); }
</script>
</body></html>
