<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimax Music 3</title>
  <!-- 配色 / 按钮 / 输入 / 状态胶囊 / 日志一律取插件控制台共享样式表（plugin-kit）；
       本地 <style> 只留布局（尺寸、间距、栅格、浮层定位）。file:// 下相对路径打到 asar 内的同一份文件。 -->
  <link rel="stylesheet" href="../../plugins/plugin-kit.css" />
  <style>
    html, body { height: 100%; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
    h1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sub { margin-top: 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* kit 没有「提示条」组件：观感取 --tint-yellow / --yellow 语义令牌，这里只排内边距与圆角 */
    .notice {
      padding: 8px 10px; line-height: 1.45;
      border: 1px solid color-mix(in srgb, var(--yellow) 38%, var(--bd));
      border-radius: var(--r-lg); background: var(--tint-yellow); color: var(--yellow);
    }
    .warn { color: var(--yellow); }
    .card { padding: 10px; gap: 8px; }
    .card-log { flex: 1; min-height: 0; }
    .bar-row { display: flex; flex-direction: column; gap: 4px; }
    #console { flex: 1; min-height: 160px; }
    .modal-bg {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      z-index: 20; background: rgba(0, 0, 0, .55);
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: min(380px, 92vw); max-height: 80vh; overflow: auto;
      padding: 14px; gap: 10px;
    }
    .modal ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="notice">
      <b>插件测试中</b> · 画布节点执行时会<strong>自动启动后端 → 生成 → 确认文件 → 关闭后端</strong>，无需手动启停。卡死时可点「强制释放显存」。
    </div>
    <div>
      <h1 class="pk-h1">Minimax Music 3 <span class="pk-pill is-warn">插件测试中</span> <span class="pk-pill" id="svcBadge">服务关闭</span></h1>
      <div class="sub pk-sub">本地 24G 音乐方案（Diffusers 后端）</div>
    </div>

    <div class="card pk-card">
      <!-- 安装相关的一切（安装目录显示 / 「目录」键 / 「安装」键 / 进度条 / 「取消安装」/
           「自我修复」兜底）都不在这只窗里：安装统一走独立安装窗（plugins/main-install.js），
           本窗只留运行期功能（启停 / 卸载 / 服务 / GPU / Console）。 -->
      <div class="row">
        <button class="pk-btn" id="btnStart" title="调试用；正常请从画布节点执行">手动启动</button>
        <button class="pk-btn" id="btnStop" title="调试用">手动停止</button>
        <button class="pk-btn pk-btn-danger" id="btnForceKill" title="卡死时用：杀后端释放显存">强制释放显存</button>
        <button class="pk-btn pk-btn-danger" id="btnUninstall">卸载</button>
      </div>
    </div>

    <div class="card pk-card">
      <div class="pk-sub">GPU 显存 <span id="gpuMemTxt">—</span></div>
      <div class="pk-progress pk-progress-lg is-info" id="gpuMemBar"><i></i></div>
      <div class="pk-sub">GPU 利用率 <span id="gpuUtilTxt">—</span></div>
      <div class="pk-progress pk-progress-lg" id="gpuUtilBar"><i></i></div>
    </div>

    <div class="card pk-card card-log">
      <div class="row">
        <div class="pk-sub">后端 Console</div>
        <button class="pk-btn pk-btn-sm" id="btnClearLog" style="margin-left:auto" title="清空日志文件（真删除，不只是清显示）">清空日志</button>
      </div>
      <div class="pk-log" id="console"></div>
    </div>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal pk-card">
      <h2 class="pk-h1">确认卸载</h2>
      <div class="warn">将删除下列已安装内容（不可恢复）。默认保留 output/。</div>
      <ul class="pk-sub" id="uninstallList"></ul>
      <label class="pk-check"><input type="checkbox" id="delOutput" /> 同时删除 output/ 音频目录</label>
      <div class="row">
        <button class="pk-btn" id="btnCancelUn">取消</button>
        <button class="pk-btn pk-btn-danger" id="btnConfirmUn">确认卸载</button>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
