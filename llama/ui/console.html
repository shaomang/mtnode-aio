<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llama.cpp Console</title>
  <link rel="stylesheet" href="../../plugins/plugin-kit.css" />
  <style>
    /* 纯日志窗：配色与日志区一律取 plugins/plugin-kit.css 的令牌与日志窗口径
       （.pk-log-head 的小字标题条 + .pk-log 的深底等宽滚动区）。只在本地留布局。 */
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font: 12px/1.5 var(--sans);
    }
    .wrap {
      display: flex; flex-direction: column; height: 100%;
      padding: 8px; gap: 6px;
    }
    .head {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 2px;
      font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    .head button {
      margin-left: auto;
      border: 1px solid transparent; background: transparent; color: var(--muted);
      border-radius: var(--r-sm); padding: 4px 8px; cursor: pointer;
      font: 11px/1 var(--sans);
      transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
    }
    .head button:hover { border-color: var(--bd); background: var(--panel2); color: var(--ink); }
    #console {
      flex: 1; min-height: 0; overflow: auto; white-space: pre-wrap; word-break: break-all;
      background: var(--code); border: 1px solid var(--bd); border-radius: var(--r-md);
      padding: 8px 10px; tab-size: 2;
      color: color-mix(in srgb, var(--ink) 86%, var(--muted));
      font: 12px/1.55 var(--mono);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span>Console</span>
      <button id="btnClear" title="清空日志文件（真删除，不只是清显示）">清空日志</button>
    </div>
    <div id="console"></div>
  </div>
  <script src="console-panel.js"></script>
</body>
</html>
