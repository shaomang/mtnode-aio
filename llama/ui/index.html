<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llama.cpp 本地模型</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6aa6ff;
      --ok: #3ecf8e;
      --danger: #ff6b6b;
      --border: #2a3140;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
      height: 100%;
    }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 8px; overflow: hidden; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .sub { color: var(--muted); font-size: 11px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .row-nowrap { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }
    button {
      border: 1px solid var(--border); background: #222836; color: var(--text);
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: #243552; border-color: #3a5f9a; }
    button.danger { background: #3a2228; border-color: #8a3a45; color: #ffc9c9; }
    button.active { border-color: var(--accent); background: #243552; }
    button.mini { padding: 4px 8px; font-size: 11px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .path {
      flex: 1; min-width: 100px; padding: 6px 8px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--border);
      color: var(--muted); word-break: break-all; font-size: 11px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
      flex-shrink: 0;
    }
    .bar {
      height: 8px; background: #0c0f14; border-radius: 999px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #2f9e6b, #3ecf8e);
      transition: width 0.25s ease;
    }
    .meta { color: var(--muted); font-size: 11px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; border: 1px solid var(--border);
    }
    .badge.on { color: var(--ok); border-color: #2f6b4e; }
    .badge.off { color: var(--muted); }
    input, select {
      background: #0c0f14; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 8px; font-size: 12px;
    }
    .tabs { display: flex; gap: 6px; }
    .tabs button.active { border-color: var(--accent); background: #243552; }
    .main {
      flex: 1; display: flex; flex-direction: column; gap: 8px;
      min-height: 0; overflow: hidden;
    }
    .list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
    .item-row {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px;
      background: #12161f; min-height: 32px;
    }
    .item-meta {
      flex-shrink: 0; display: flex; flex-direction: column; justify-content: center;
      line-height: 1.05; font-size: 9px; color: var(--muted);
      width: 38px; text-align: right;
    }
    .item-meta span { white-space: nowrap; }
    .item-row .name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 12px;
    }
    .keybox {
      font: 11px/1.4 ui-monospace, Consolas, monospace;
      background: #0c0f14; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; word-break: break-all; user-select: all;
    }
    .title-row {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .title-row .grow { flex: 1; min-width: 0; }
    .vram-wrap {
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      min-width: 130px; flex-shrink: 0;
    }
    .vram-line {
      display: flex; align-items: center; gap: 6px; width: 100%; justify-content: flex-end;
    }
    .vram-bar { width: 64px; flex-shrink: 0; }
    .vram-txt { font-size: 10px; color: var(--muted); white-space: nowrap; line-height: 1; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #1a2030; border: 1px solid var(--border); border-radius: 12px;
      width: min(440px, 92vw); max-height: 82vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .modal-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .modal-head strong { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-body { padding: 10px 12px; overflow: auto; }
    .detail-form {
      margin: 0; display: grid; grid-template-columns: 88px 1fr;
      gap: 5px 10px; font-size: 12px;
    }
    .detail-form dt { color: var(--muted); margin: 0; }
    .detail-form dd { margin: 0; word-break: break-word; }
    #installProgress { display: none; }
    #installProgress.on { display: block; }
    #apiPanel { display: none; }
    #apiPanel.on { display: flex; }
    .filter-row {
      display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
      font-size: 11px; color: var(--muted);
    }
    .size-filters { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .size-filters label, .filter-row .chk {
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;
    }
    .size-filters input, .filter-row input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
    .svc-row {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; flex-shrink: 0;
    }
    .spin {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: -2px; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.waiting {
      display: inline-flex; align-items: center; gap: 5px;
      opacity: 1; cursor: wait;
    }
    #installProgress .meta { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title-row">
      <div class="grow">
        <h1>llama.cpp 本地模型</h1>
        <div class="sub">国内镜像 · Agent 保底安装</div>
      </div>
      <div class="vram-wrap" id="vramWrap">
        <div class="vram-line">
          <div class="bar vram-bar"><i id="gpuBar"></i></div>
          <span class="vram-txt" id="gpuTxt">—</span>
        </div>
      </div>
      <button id="btnApi" class="mini" title="显示/隐藏 API 信息">API</button>
      <button id="btnConsole" class="mini" title="左侧 Console">Console</button>
    </div>

    <div class="card" id="installCard">
      <div class="row">
        <div class="path" id="installDir">未选择安装目录</div>
        <button id="btnPickDir" class="mini">目录</button>
        <button id="btnInstall" class="primary mini">安装</button>
      </div>
      <div id="installProgress">
        <div class="meta" id="installStep"><span class="spin" id="installSpin"></span><span id="installStepTxt">准备安装…</span></div>
        <div class="bar" id="installBar"><i></i></div>
      </div>
    </div>

    <div class="svc-row row-nowrap">
      <span class="badge off" id="svcBadge">未运行</span>
      <button id="btnStart" class="primary mini">启用</button>
      <button id="btnStop" class="danger mini">停止</button>
    </div>

    <div class="card" id="apiPanel">
      <div class="meta">本地 API</div>
      <div class="keybox" id="apiBase">—</div>
      <div class="meta">API Key</div>
      <div class="keybox" id="apiKey">—</div>
    </div>

    <div class="main">
      <div class="tabs">
        <button class="active" data-tab="catalog">在线模型</button>
        <button data-tab="local">已安装</button>
      </div>
      <div class="row">
        <input id="searchQ" placeholder="搜索模型…" style="flex:1" />
        <select id="kindFilter">
          <option value="all">全部</option>
          <option value="llm">LLM</option>
          <option value="embedding">Embedding</option>
        </select>
        <button id="btnSearch" class="mini">搜索</button>
      </div>
      <div class="filter-row" id="catalogFilters">
        <div class="size-filters">
          <span>体积</span>
          <label><input type="radio" name="sizeFilter" value="" checked />全部</label>
          <label><input type="radio" name="sizeFilter" value="lt16" />&lt;16GB</label>
          <label><input type="radio" name="sizeFilter" value="lt32" />&lt;32GB</label>
          <label><input type="radio" name="sizeFilter" value="lt64" />&lt;64GB</label>
          <label><input type="radio" name="sizeFilter" value="gt64" />&gt;64GB</label>
        </div>
        <label class="chk"><input type="checkbox" id="recentOnly" />仅半年内新模型</label>
      </div>
      <div class="list" id="modelList"></div>
    </div>
  </div>

  <div class="modal-bg" id="detailModal">
    <div class="modal">
      <div class="modal-head">
        <strong id="detailTitle">模型详情</strong>
        <button id="detailClose" class="mini">关闭</button>
      </div>
      <div class="modal-body">
        <dl class="detail-form" id="detailForm"></dl>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
