<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llama.cpp 本地模型</title>
  <link rel="stylesheet" href="../../plugins/plugin-kit.css" />
  <style>
    /* 配色与控件一律取 plugins/plugin-kit.css 的令牌（--bg / --panel / --panel2 /
       --ink / --muted / --bd / --bd2 / --orange / --cyan / --green / --red / --yellow），
       本文件只留布局：蓝紫调色板已全部换成 kit 的橙（动作）+ 青（信息 / 选中）。 */
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font: 13px/1.45 var(--sans);
      height: 100%;
    }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 8px; overflow: hidden; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--ink); }
    .sub { color: var(--muted); font-size: 11px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .row-nowrap { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }
    button {
      border: 1px solid var(--bd2); background: var(--panel2); color: var(--ink);
      border-radius: var(--r-sm); padding: 6px 10px; cursor: pointer; font: 12px/1 var(--sans);
      transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
    }
    button:hover { border-color: var(--bd2); background: color-mix(in srgb, var(--panel2) 70%, var(--ink) 8%); }
    button.primary {
      border-color: color-mix(in srgb, var(--orange) 55%, var(--bd2));
      background: color-mix(in srgb, var(--orange) 18%, var(--panel2));
      color: var(--orange2); font-weight: 600;
    }
    button.primary:hover { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 26%, var(--panel2)); color: var(--orange2); }
    button.danger {
      border-color: color-mix(in srgb, var(--red) 45%, var(--bd2));
      background: transparent; color: color-mix(in srgb, var(--red) 78%, var(--ink));
    }
    button.danger:hover { border-color: var(--red); background: var(--tint-red); color: color-mix(in srgb, var(--red) 88%, var(--ink)); }
    button.active { border-color: var(--cyan); background: var(--tint-cyan); color: var(--cyan2); }
    button.mini { padding: 4px 8px; font-size: 11px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .path {
      flex: 1; min-width: 100px; padding: 6px 8px; border-radius: var(--r-sm);
      background: var(--panel); border: 1px solid var(--bd);
      color: var(--muted); word-break: break-all; font-size: 11px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--bd);
      border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
      flex-shrink: 0;
    }
    .bar {
      height: 8px; background: var(--code); border-radius: 999px; overflow: hidden;
      border: 1px solid var(--bd);
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--orange), var(--orange2));
      transition: width 0.25s var(--ease-out);
    }
    .meta { color: var(--muted); font-size: 11px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; border: 1px solid var(--bd2); background: var(--panel2); color: var(--muted);
    }
    .badge.on { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, var(--bd)); background: var(--tint-green); }
    .badge.off { color: var(--muted); }
    input, select {
      background: var(--code); border: 1px solid var(--bd2); color: var(--ink);
      border-radius: var(--r-sm); padding: 6px 8px; font: 12px/1.5 var(--sans);
    }
    input:focus, select:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 18%, transparent);
    }
    .tabs { display: flex; gap: 6px; }
    .tabs button.active { border-color: var(--cyan); background: var(--tint-cyan); color: var(--cyan2); }
    .main {
      flex: 1; display: flex; flex-direction: column; gap: 8px;
      min-height: 0; overflow: hidden;
    }
    .list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
    .item-row {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border: 1px solid var(--bd); border-radius: var(--r-sm);
      background: var(--panel2); min-height: 32px;
    }
    .item-meta {
      flex-shrink: 0; display: flex; flex-direction: column; justify-content: center;
      line-height: 1.05; font-size: 9px; color: var(--muted);
      width: 38px; text-align: right;
    }
    .item-meta span { white-space: nowrap; }
    .dl-cell { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .dl-bar { width: 88px; flex-shrink: 0; }
    .dl-txt { font-size: 10px; color: var(--muted); white-space: nowrap; min-width: 44px; text-align: right; }
    .item-row .name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 12px;
    }
    /* 架构状态小标（行尾）：未确认 = 黄，引擎不支持 = 红。见 ui/app.js 的 renderItems */
    .arch-tag {
      flex-shrink: 0; font-size: 10px; padding: 1px 6px; border-radius: 999px;
      border: 1px solid var(--bd2); color: var(--muted); white-space: nowrap;
    }
    .arch-tag.warn { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 40%, var(--bd)); background: var(--tint-yellow); }
    .arch-tag.bad { color: color-mix(in srgb, var(--red) 85%, var(--ink)); border-color: color-mix(in srgb, var(--red) 40%, var(--bd)); background: var(--tint-red); }
    .keybox {
      font: 11px/1.4 var(--mono);
      background: var(--code); border: 1px solid var(--bd2); border-radius: var(--r-sm);
      padding: 6px 8px; word-break: break-all; user-select: all;
    }
    .title-row {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .title-row .grow { flex: 1; min-width: 0; }
    .vram-wrap {
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      min-width: 130px; flex-shrink: 0;
    }
    .vram-line {
      display: flex; align-items: center; gap: 6px; width: 100%; justify-content: flex-end;
    }
    .vram-bar { width: 64px; flex-shrink: 0; }
    .vram-txt { font-size: 10px; color: var(--muted); white-space: nowrap; line-height: 1; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--panel2); border: 1px solid var(--bd2); border-radius: var(--r-lg);
      box-shadow: var(--shadow-pop);
      width: min(440px, 92vw); max-height: 82vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .modal-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--bd);
    }
    .modal-head strong { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-body { padding: 10px 12px; overflow: auto; }
    .detail-form {
      margin: 0; display: grid; grid-template-columns: 88px 1fr;
      gap: 5px 10px; font-size: 12px;
    }
    .detail-form dt { color: var(--muted); margin: 0; }
    .detail-form dd { margin: 0; word-break: break-word; }
    #apiPanel { display: none; }
    #apiPanel.on { display: flex; }
    .filter-row {
      display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
      font-size: 11px; color: var(--muted);
    }
    .size-filters { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .size-filters label, .filter-row .chk {
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;
    }
    .size-filters input, .filter-row input[type="checkbox"] { margin: 0; accent-color: var(--orange); }
    .svc-row {
      background: var(--panel); border: 1px solid var(--bd); border-radius: var(--r-md);
      padding: 8px 10px; flex-shrink: 0;
    }
    .spin {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid var(--bd2); border-top-color: var(--orange);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: -2px; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.waiting {
      display: inline-flex; align-items: center; gap: 5px;
      opacity: 1; cursor: wait;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title-row">
      <div class="grow">
        <h1>llama.cpp 本地模型</h1>
        <div class="sub">本地 GGUF 模型 · OpenAI 兼容 API</div>
      </div>
      <div class="vram-wrap" id="vramWrap">
        <div class="vram-line">
          <div class="bar vram-bar"><i id="gpuBar"></i></div>
          <span class="vram-txt" id="gpuTxt">—</span>
        </div>
      </div>
      <button id="btnApi" class="mini" title="显示/隐藏 API 信息">API</button>
      <button id="btnConsole" class="mini" title="左侧 Console">Console</button>
    </div>

    <div class="svc-row row-nowrap">
      <span class="badge off" id="svcBadge">未运行</span>
      <button id="btnStart" class="primary mini">启用</button>
      <button id="btnStop" class="danger mini">停止</button>
    </div>

    <!-- 安装目录对不上时的一句实话（见 app.js 的 refreshStatus）：
         端口上这份脚手架不是 MTNode 配置的那一份 —— 平台上模型登记会因此错位 -->
    <div class="card" id="rootMismatch" style="display:none">
      <div class="meta">安装目录</div>
      <div class="keybox" id="rootMismatchText">—</div>
    </div>

    <div class="card" id="apiPanel">
      <div class="meta">本地 API</div>
      <div class="keybox" id="apiBase">—</div>
      <div class="meta">API Key</div>
      <div class="keybox" id="apiKey">—</div>
    </div>

    <div class="main">
      <div class="tabs">
        <button class="active" data-tab="catalog">在线模型</button>
        <button data-tab="local">已安装</button>
      </div>
      <div class="row">
        <input id="searchQ" placeholder="搜索模型…" style="flex:1" />
        <select id="kindFilter">
          <!-- 列表口径只剩 llm（见 llama-pack/app/catalog.py 的 _CATALOG_KINDS）：
               「全部」与「LLM」等价，保留两档只为兼容老习惯，不再列 Embedding。 -->
          <option value="all">全部</option>
          <option value="llm">LLM</option>
        </select>
        <button id="btnSearch" class="mini">搜索</button>
      </div>
      <div class="filter-row" id="catalogFilters">
        <div class="size-filters">
          <span>体积</span>
          <label><input type="radio" name="sizeFilter" value="" checked />全部</label>
          <label><input type="radio" name="sizeFilter" value="lt16" />&lt;16GB</label>
          <label><input type="radio" name="sizeFilter" value="lt32" />&lt;32GB</label>
          <label><input type="radio" name="sizeFilter" value="lt64" />&lt;64GB</label>
          <label><input type="radio" name="sizeFilter" value="gt64" />&gt;64GB</label>
        </div>
        <label class="chk"><input type="checkbox" id="recentOnly" />仅半年内新模型</label>
      </div>
      <div class="list" id="modelList"></div>
    </div>
  </div>

  <div class="modal-bg" id="detailModal">
    <div class="modal">
      <div class="modal-head">
        <strong id="detailTitle">模型详情</strong>
        <button id="detailClose" class="mini">关闭</button>
      </div>
      <div class="modal-body">
        <dl class="detail-form" id="detailForm"></dl>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
