<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPT-SoVITS TTS Console</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0d13; color: #c8d3df;
      font: 11px/1.5 ui-monospace, Consolas, monospace;
    }
    #log { padding: 8px; white-space: pre-wrap; word-break: break-all; height: 100%; overflow: auto; }
    .muted { color: #5b6b7d; }
    .err { color: #ff8a8a; }
  </style>
</head>
<body>
  <div id="log"></div>
  <script src="console-panel.js"></script>
</body>
</html>
