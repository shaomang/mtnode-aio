<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>InfiniteTalk 数字人</title>
    <!-- 配色 / 按钮 / 输入 / 状态胶囊 / 进度条 / 日志一律取插件控制台共享样式表（plugin-kit）；
         本地 <style> 只留布局（尺寸、间距、栅格）。file:// 下相对路径打到同一份文件。 -->
    <link rel="stylesheet" href="../../plugins/plugin-kit.css" />
    <style>
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--bd);
        background: var(--panel);
      }
      header .grow { flex: 1 1 auto; }
      main { display: grid; gap: 10px; padding: 12px 14px 24px; }
      .body { display: grid; gap: 8px; }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .field { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
      .field .pk-select, .field .pk-input { width: auto; }
      .field .pk-input.num { width: 78px; }
      /* 输入控件与 .pk-btn 同高（28px），同一行不错位 */
      .path-row .pk-input, .field .pk-input, .field .pk-select { height: 28px; }
      /* 路径输入行：等宽 + 撑满，和右侧按钮同高 */
      .path-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .path-row .pk-input { flex: 1 1 240px; min-width: 200px; font: 12px/1.5 var(--mono); }
      /* 进度条只补外边距（配色与过渡在 kit 的 .pk-progress 里） */
      .pk-progress { margin: 2px 0 0; }
      /* 拖放位：观感取 kit 令牌，不写死色值；.set = 拖拽悬停 / 已填入路径 */
      .drop {
        padding: 6px 9px;
        min-height: 32px;
        border: 1px dashed var(--bd2);
        border-radius: var(--r-md);
        color: var(--muted);
        font: 12px/1.5 var(--mono);
        word-break: break-all;
      }
      .drop.set {
        border-color: color-mix(in srgb, var(--cyan) 60%, var(--bd2));
        background: var(--tint-cyan);
        color: var(--ink);
      }
      #log { height: 240px; flex: none; }
      /* #phase 的 className 由 ui.js 写成 "badge ok|err|"（本任务不动脚本），
         这里按 .pk-pill 的几何 + kit 的语义令牌复刻一份，不另写色值。 */
      .badge {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 8px;
        border: 1px solid var(--bd2);
        border-radius: 999px;
        background: var(--panel2);
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
      }
      .badge.ok {
        border-color: color-mix(in srgb, var(--green) 40%, var(--bd));
        background: var(--tint-green);
        color: var(--green);
      }
      .badge.warn {
        border-color: color-mix(in srgb, var(--orange) 40%, var(--bd));
        background: var(--tint-orange);
        color: var(--orange2);
      }
      .badge.err {
        border-color: color-mix(in srgb, var(--red) 40%, var(--bd));
        background: var(--tint-red);
        color: color-mix(in srgb, var(--red) 85%, var(--ink));
      }
    </style>
  </head>
  <body>
    <header>
      <span class="pk-h1">InfiniteTalk 数字人</span>
      <span class="badge" id="phase">…</span>
      <span class="pk-sub" id="ver"></span>
      <span class="pk-sub" id="progressText"></span>
      <span class="grow"></span>
      <button id="btnClose" class="pk-btn pk-btn-ghost pk-btn-sm">关闭窗口</button>
    </header>

    <main>
      <section class="pk-card">
        <div class="pk-card-head"><span class="pk-h2">安装</span></div>
        <div class="pk-card-body body">
          <div class="path-row">
            <input type="text" class="pk-input" id="installDir" placeholder="安装目录（建议独立盘，约 32GB）" />
            <button id="btnPickDir" class="pk-btn">选择目录</button>
            <button id="btnInstall" class="pk-btn pk-btn-primary">安装 / 重装</button>
            <button id="btnCancelInstall" class="pk-btn pk-btn-danger">取消安装</button>
          </div>
          <div class="row">
            <label class="field">分辨率
              <select id="resolution" class="pk-select">
                <option value="480p">480p（832×480 · 推荐）</option>
                <option value="720p">720p（1280×768 · 更慢 / 更吃显存）</option>
              </select>
            </label>
            <label class="field">步数
              <input type="number" id="steps" class="pk-input num" min="1" max="40" step="1" />
            </label>
            <label class="field">显存档位
              <select id="vramMode" class="pk-select">
                <option value="auto">自动（推荐）</option>
                <option value="low">低显存（强制分层卸载）</option>
              </select>
            </label>
          </div>
          <div class="pk-progress pk-progress-lg"><i id="bar"></i></div>
          <div class="pk-sub" id="installHint">默认开启：fp8 扩散模型 + lightx2v 4 步 + SageAttention（强制）+ 显存水位。</div>
        </div>
      </section>

      <section class="pk-card">
        <div class="pk-card-head"><span class="pk-h2">后端</span></div>
        <div class="pk-card-body row">
          <button id="btnStart" class="pk-btn">启动后端</button>
          <button id="btnStop" class="pk-btn pk-btn-danger">停止后端</button>
          <button id="btnHealth" class="pk-btn pk-btn-ghost">健康检查</button>
          <span class="pk-sub" id="backendText"></span>
        </div>
      </section>

      <section class="pk-card">
        <div class="pk-card-head"><span class="pk-h2">试生成（I2V / V2V）</span></div>
        <div class="pk-card-body body">
          <div class="grid2">
            <div>
              <div class="pk-sub">人物图（I2V，端口 0）</div>
              <div class="drop" id="dropImage" data-kind="image">把人物图拖进来</div>
            </div>
            <div>
              <div class="pk-sub">源视频（V2V，可选；填了就按视频换口型）</div>
              <div class="drop" id="dropVideo" data-kind="video">把源视频拖进来</div>
            </div>
          </div>
          <div>
            <div class="pk-sub">语音（必填）</div>
            <div class="drop" id="dropAudio" data-kind="audio">把音频拖进来</div>
          </div>
          <div>
            <div class="pk-sub">提示词（可空）</div>
            <textarea id="prompt" class="pk-textarea" placeholder="留空用内置默认提示词"></textarea>
          </div>
          <div class="row">
            <button id="btnGen" class="pk-btn pk-btn-primary">开始试生成</button>
            <button id="btnCancelGen" class="pk-btn">取消</button>
            <span class="pk-sub" id="genText"></span>
          </div>
          <div class="pk-sub" id="genResult" style="word-break: break-all"></div>
        </div>
      </section>

      <section class="pk-card">
        <div class="pk-card-head">
          <span class="pk-h2">日志</span>
          <span class="pk-grow"></span>
          <button id="btnLogRefresh" class="pk-btn pk-btn-sm">刷新</button>
          <button id="btnLogClear" class="pk-btn pk-btn-sm">清空</button>
        </div>
        <div class="pk-card-body body">
          <div class="pk-sub" id="gpuText"></div>
          <div id="log" class="pk-log"></div>
        </div>
      </section>
    </main>

    <script src="./ui.js"></script>
  </body>
</html>
