<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地语音转写控制台（Qwen3-ASR）</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <div class="wrap">
    <div class="title-row">
      <h1>本地语音转写（Qwen3-ASR）</h1>
      <span id="badgeState" class="badge off">读取中…</span>
    </div>
    <div class="sub">把音频接到文字处理节点即自动转写并注入提示词；后端静默运行、随 MTNode 退出而结束。</div>

    <div class="card">
      <div class="kv"><span class="k">模型来源</span><span class="v" id="vModel">—</span></div>
      <div class="kv"><span class="k">分段模型</span><span class="v" id="vVad">—</span></div>
      <div class="kv"><span class="k">本机显卡</span><span class="v" id="vGpu">—</span></div>
      <div class="kv"><span class="k">安装目录</span><span class="v" id="vDir">—</span></div>
      <div class="kv"><span class="k">ffmpeg（音频解码）</span><span class="v" id="vFfmpeg">—</span></div>
      <div class="kv"><span class="k">磁盘建议</span><span class="v" id="vDisk">—</span></div>
      <div class="row">
        <button id="btnDir">选择安装目录</button>
        <button id="btnModelDir">选择已有模型目录</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <button id="btnInstall" class="primary">安装</button>
        <button id="btnFfmpeg">补装 ffmpeg</button>
        <button id="btnRepair">交给 AI 修复</button>
        <button id="btnCancel" disabled>取消安装</button>
      </div>
      <div class="row">
        <button id="btnStart">启动后端</button>
        <button id="btnStop">停止后端</button>
        <button id="btnRelease">立即释放</button>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="meta" id="progMsg">就绪</div>
    </div>

    <div class="card">
      <div class="row-nowrap">
        <span class="grow">运行日志（console.log 尾部）</span>
        <button id="btnClearLog" class="mini">刷新</button>
      </div>
      <pre class="log" id="log">（暂无日志）</pre>
    </div>

    <div class="card">
      <div class="kv"><span class="k">空闲释放（分钟，0 = 不释放）</span>
        <input id="inIdle" type="number" min="0" max="240" /></div>
      <div class="kv"><span class="k">全局默认热词（逗号分隔）</span>
        <input id="inHot" type="text" placeholder="人名、产品名、专业术语" /></div>
      <div class="kv"><span class="k">仍装 CPU 版（很慢，仅在无 N 卡时兜底）</span>
        <input id="inCpu" type="checkbox" /></div>
      <div class="row">
        <button id="btnSaveCfg" class="primary">保存设置</button>
        <span class="meta" id="cfgMsg"></span>
      </div>
    </div>
  </div>
  <script src="ui.js"></script>
</body>
</html>
