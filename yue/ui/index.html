<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YuE 音乐生成</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #a78bfa;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --danger: #ff6b6b;
      --border: #2a3140;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
      height: 100%;
    }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .sub { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      border: 1px solid var(--border); background: #222836; color: var(--text);
      border-radius: 8px; padding: 7px 12px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: #2f2547; border-color: #6d4fc4; }
    button.danger { background: #3a2228; border-color: #8a3a45; color: #ffc9c9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .path {
      flex: 1; min-width: 120px; padding: 7px 10px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--border);
      color: var(--muted); word-break: break-all; font-size: 12px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .bar {
      height: 10px; background: #0c0f14; border-radius: 999px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #6d4fc4, #a78bfa);
      transition: width 0.25s ease;
    }
    .bar.gpu > i { background: linear-gradient(90deg, #2f9e6b, #3ecf8e); }
    .bar.util > i { background: linear-gradient(90deg, #b8860b, #f0b429); }
    .meta { color: var(--muted); font-size: 12px; }
    #console {
      flex: 1; min-height: 160px; overflow: auto; white-space: pre-wrap;
      font: 11px/1.4 ui-monospace, Consolas, monospace;
      background: #0c0f14; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; color: #c5d0e6;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; border: 1px solid var(--border);
    }
    .badge.on { color: var(--ok); border-color: #2f6b4e; }
    .badge.off { color: var(--muted); }
    .badge.test {
      color: #d9caff; border-color: #5b43a0; background: #241a3d;
      margin-left: 6px; vertical-align: middle;
    }
    .badge.lock { color: var(--warn); border-color: #6b5418; }
    .notice {
      background: #241a3d; border: 1px solid #5b43a0; border-radius: 10px;
      padding: 8px 10px; color: #d9caff; font-size: 12px; line-height: 1.45;
    }
    .warn { color: var(--warn); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="notice">
      <b>插件测试中</b> · 画布节点执行时会<strong>自动启动后端 → 生成 → 转写音频 → 回填路径</strong>，无需手动启停。后端写出的 <code>audio.flac</code> 会用 venv 里的 soundfile / librosa 直写成 <code>.wav</code>（不依赖 ffmpeg）。安装复杂，可能会失败。
    </div>
    <div>
      <h1>YuE 音乐生成 <span class="badge test">插件测试中</span> <span class="badge off" id="svcBadge">服务关闭</span> <span class="badge off" id="lockBadge">全局锁空闲</span> <span class="badge off" id="attBadge" title="注意力档位：flash 在 Windows 轮子里没编 kernel，需实测选档">注意力 —</span></h1>
      <div class="sub">本地歌词 → 歌曲 · <span id="diskLine">建议预留磁盘</span></div>
    </div>

    <div class="card">
      <div class="meta">安装目录</div>
      <div class="row">
        <div class="path" id="installDir">未设置</div>
        <button id="btnDir">设置…</button>
      </div>
      <div class="meta" id="diskHint"></div>
      <div class="row">
        <button class="primary" id="btnInstall">安装</button>
        <button class="danger" id="btnCancelInstall">取消安装</button>
        <button id="btnStart" title="调试用；正常请从画布节点执行">手动启动</button>
        <button id="btnStop" title="调试用">手动停止</button>
        <button id="btnCloseWin" style="margin-left:auto">关闭窗口</button>
      </div>
      <div class="meta" id="installStep">—</div>
      <div class="bar" id="installBar"><i></i></div>
      <div class="meta" id="subStep"></div>
      <div class="bar" id="subBar" style="height:7px"><i></i></div>
    </div>

    <div class="card">
      <div class="meta">GPU 显存 <span id="gpuMemTxt">—</span></div>
      <div class="bar gpu" id="gpuMemBar"><i></i></div>
      <div class="meta">GPU 利用率 <span id="gpuUtilTxt">—</span></div>
      <div class="bar util" id="gpuUtilBar"><i></i></div>
    </div>

    <div class="card" style="flex:1; min-height:0">
      <div class="row">
        <div class="meta">后端 Console</div>
        <button id="btnClearLog" style="margin-left:auto;padding:4px 8px">清空视图</button>
      </div>
      <div id="console"></div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
