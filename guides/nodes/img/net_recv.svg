  </defs>
  <rect x="16" y="56" width="118" height="48" rx="6" fill="#101820" stroke="#38d6ff" stroke-width="1.6"/>
  <text x="75" y="84" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">TCP / UDP 监听</text>
  <line x1="134" y1="74" x2="178" y2="62" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="178" y1="62" x2="134" y2="74" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="178" y="44" width="140" height="72" rx="6" fill="#1a140e" stroke="#ff8f2e" stroke-width="1.6"/>
  <text x="248" y="84" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">网络 · 接收</text>
  <line x1="318" y1="62" x2="360" y2="44" stroke="#5fd68a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="318" y1="90" x2="360" y2="104" stroke="#f0c14d" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="360" y="24" width="140" height="40" rx="6" fill="#101610" stroke="#5fd68a" stroke-width="1.6"/>
