  <text x="470" y="154" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">控制下游</text>
  <text x="280" y="216" text-anchor="middle" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">产物自动落资产目录 · 连图即图像编辑（参考图参与条件）· 全局仅 1 个音视频任务</text>
