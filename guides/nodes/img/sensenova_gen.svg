  <rect x="16" y="118" width="104" height="34" rx="6" fill="#101820" stroke="#f0c14d" stroke-width="1.6"/>
  <text x="68" y="140" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">控制输入</text>
  <line x1="120" y1="69" x2="176" y2="86" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="120" y1="135" x2="176" y2="122" stroke="#f0c14d" stroke-width="1.8" marker-end="url(#arr)"/>
