<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" width="520" height="190">
  <rect width="520" height="190" fill="#0d1016"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f0c14d"/>
    </marker>
  </defs>
  <rect x="18" y="64" width="104" height="48" rx="6" fill="#12151b" stroke="#8b97a8" stroke-width="1.6"/>
  <text x="70" y="92" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">素材库素材</text>
  <line x1="122" y1="88" x2="166" y2="88" stroke="#8b97a8" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="184" y="10" width="140" height="30" rx="6" fill="#101820" stroke="#38d6ff" stroke-width="1.6"/>
  <text x="254" y="30" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">第 i 入 = 可写回</text>
  <line x1="254" y1="40" x2="254" y2="50" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="166" y="54" width="130" height="80" rx="6" fill="#1a140e" stroke="#ff8f2e" stroke-width="1.6"/>
  <text x="231" y="98" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">素材节点 · 绑定</text>
  <line x1="296" y1="110" x2="344" y2="132" stroke="#5fd68a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="344" y="112" width="150" height="40" rx="6" fill="#101610" stroke="#5fd68a" stroke-width="1.6"/>
  <text x="419" y="136" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">第 i 出 = 读出内容</text>
  <text x="250" y="152" text-anchor="middle" fill="#5a6472" font-size="10" font-family="Segoe UI,sans-serif">端子名 = 内容标题 · 没有控制端子</text>
  <text x="260" y="180" text-anchor="middle" fill="#5a6472" font-size="10" font-family="Segoe UI,sans-serif">节点只存绑定 · 改内容就是改库 · 删节点不丢库</text>
  <text x="512" y="14" text-anchor="end" fill="#3b4452" font-size="9" font-family="Segoe UI,sans-serif">asset</text>
