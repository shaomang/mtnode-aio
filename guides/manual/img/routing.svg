  <line x1="140" y1="84" x2="190" y2="84" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="190" y="60" width="110" height="48" rx="6" fill="#1a1610" stroke="#f0c14d" stroke-width="1.6"/>
