<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="680" height="210">
  <defs>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#38bdf8"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#f59e0b"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#c792ea"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#4ade80"/></marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#fb7185"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#a8b5c8"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="209" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>一句话让助手帮你搭好工作流</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>不用自己一个个找节点，先把想法说出来，再按需要微调</text>
  <rect x="20" y="66" width="194" height="102" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="21" y="67" width="192" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <text x="117" y="106" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>1. 描述你的目标</text>
  <text x="117" y="124" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>打开右侧助手 ✦ 说清：</text>
  <text x="117" y="138.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>输入是什么 → 怎么处理 → 要什么成品</text>
  <line x1="214" y1="117" x2="250" y2="117" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="250" y="66" width="194" height="102" rx="8" fill="#21182c" stroke="#c792ea" stroke-width="1.5"/>
  <rect x="251" y="67" width="192" height="4" rx="2" fill="#c792ea" opacity="0.85"/>
  <text x="347" y="106" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>2. 助手自动搭建</text>
  <text x="347" y="124" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>在当前画布创建节点、</text>
  <text x="347" y="138.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>写好提示词、连线并排版</text>
  <line x1="444" y1="117" x2="480" y2="117" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="480" y="66" width="180" height="102" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="481" y="67" width="178" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <text x="570" y="106" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>3. 换素材 · 点 ▶ 跑</text>
  <text x="570" y="124" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>把示例内容换成你的资料</text>
  <text x="570" y="138.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>点开始按钮一键出结果</text>
  <text x="340" y="198" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>助手默认只在空白处新增节点，不会删你原有的东西；不满意随时 Ctrl+Z 撤销</text>
</svg>
