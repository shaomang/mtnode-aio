<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" height="214">
  <defs>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#38bdf8"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#f59e0b"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#c792ea"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#4ade80"/></marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#fb7185"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#a8b5c8"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="213" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>AI 审阅：边批注边让 AI 改稿</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>不用自己重写整段，像批改作业一样标出哪里要改</text>
  <rect x="18" y="68" width="122" height="104" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="19" y="69" width="120" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <text x="79" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>1. 打开审阅</text>
  <text x="79" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>在节点输出框</text>
  <text x="79" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>点「审阅」按钮</text>
  <line x1="140" y1="120" x2="166" y2="120" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="166" y="68" width="134" height="104" rx="8" fill="#261d12" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="167" y="69" width="132" height="4" rx="2" fill="#f59e0b" opacity="0.85"/>
  <text x="233" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>2. 标出批注</text>
  <text x="233" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>选中某句写意见</text>
  <text x="233" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>或写全文要求</text>
  <line x1="300" y1="120" x2="326" y2="120" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="326" y="68" width="134" height="104" rx="8" fill="#21182c" stroke="#c792ea" stroke-width="1.5"/>
  <rect x="327" y="69" width="132" height="4" rx="2" fill="#c792ea" opacity="0.85"/>
  <text x="393" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>3. AI 按批注改</text>
  <text x="393" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>自动生成新版本</text>
  <text x="393" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>保留历史版本</text>
  <line x1="460" y1="120" x2="486" y2="120" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="486" y="68" width="176" height="104" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="487" y="69" width="174" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <text x="574" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>4. 核对并采纳</text>
  <text x="574" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>满意 → 采用当前版写回</text>
  <text x="574" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>不满意 → 继续批注或回滚</text>
  <text x="340" y="202" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>每一版都会完整保留，不满意随时点回滚；点「采用当前版」才写回节点</text>
</svg>
