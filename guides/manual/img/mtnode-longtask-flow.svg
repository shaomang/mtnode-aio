  <rect x="0.5" y="0.5" width="679" height="217" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>长周期任务：AI 自动推进 + 关键节点人工把关</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>把复杂的多阶段项目画成流程图，该自动的自动跑，该你拍板的地方会停下来等你</text>
  <rect x="18" y="68" width="142" height="108" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="19" y="69" width="140" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <text x="89" y="111" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>1. 顶部任务条</text>
  <text x="89" y="129" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>看全流程阶段图</text>
  <text x="89" y="143.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>谁在跑、谁在等你</text>
  <line x1="160" y1="122" x2="188" y2="122" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="188" y="68" width="146" height="108" rx="8" fill="#21182c" stroke="#c792ea" stroke-width="1.5"/>
  <rect x="189" y="69" width="144" height="4" rx="2" fill="#c792ea" opacity="0.85"/>
  <text x="261" y="111" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>2. 自动执行环节</text>
  <text x="261" y="129" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>AI 跑完把结果</text>
  <text x="261" y="143.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>写进「产出节点」</text>
  <line x1="334" y1="122" x2="362" y2="122" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="362" y="68" width="148" height="108" rx="8" fill="#261d12" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="363" y="69" width="146" height="4" rx="2" fill="#f59e0b" opacity="0.85"/>
  <text x="436" y="111" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>3. 人工把关环节</text>
  <text x="436" y="129" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>审批通过 / 写驳回理由</text>
  <text x="436" y="143.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>或在交付节点传素材</text>
  <line x1="510" y1="122" x2="538" y2="122" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="538" y="68" width="124" height="108" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="539" y="69" width="122" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <text x="600" y="111" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>4. 汇总与复用</text>
  <text x="600" y="129" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>关键成品收进</text>
  <text x="600" y="143.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>「产物节点」留档</text>
  <text x="340" y="206" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>所有阶段产出都会摆在画布上，你可以直接改内容，后面的步骤会接着用你的修改版</text>
</svg>
