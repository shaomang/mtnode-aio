<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
  <rect width="620" height="200" fill="#0d1016"/>
  <defs>
  <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f0c14d"/></marker>
  <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38d6ff"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff8f2e"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fd68a"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff6b6b"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c792ea"/></marker>
  </defs>
  <rect x="16" y="44" width="170" height="46" rx="6" fill="#101820" stroke="#38d6ff" stroke-width="1.6"/>
  <text x="101" y="64.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">应用窗口</text>
  <text x="101" y="77.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">静态 HTML / JS / CSS</text>
  <line x1="186" y1="67" x2="232" y2="67" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="232" y="44" width="200" height="46" rx="6" fill="#161020" stroke="#c792ea" stroke-width="1.6"/>
  <text x="332" y="58" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">appHost 能力桥</text>
  <text x="332" y="71" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">dataGet / dataSet · authMe</text>
  <text x="332" y="84" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">storeRequest · pickImage</text>
  <line x1="432" y1="67" x2="478" y2="67" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="478" y="44" width="126" height="46" rx="6" fill="#1a1610" stroke="#f0c14d" stroke-width="1.6"/>
  <text x="541" y="64.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">主进程</text>
  <text x="541" y="77.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">数据目录 / 凭据</text>
  <rect x="16" y="118" width="170" height="46" rx="6" fill="#1a140e" stroke="#ff8f2e" stroke-width="1.6"/>
  <text x="101" y="138.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">降级：桥不在也能跑</text>
  <text x="101" y="151.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">内存态 + 明确提示</text>
  <rect x="232" y="118" width="372" height="46" rx="6" fill="#101610" stroke="#5fd68a" stroke-width="1.6"/>
  <text x="418" y="138.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">模型 API 与工具不在应用窗口里</text>
  <text x="418" y="151.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">要内建 LLM / 图像 / 语音 → 升级为本地后端插件（主进程 + 控制台 + 画布节点）</text>
  <text x="16" y="190" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">数据只走 dataGet / dataSet（落 %APPDATA%\pipeline-console\app-plugins\&lt;id&gt;），绝不写应用目录</text>
  <text x="310" y="188" text-anchor="middle" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">应用 = 静态前端 + 宿主能力桥；模型与工具留在主程序 / 画布一侧</text>
</svg>
