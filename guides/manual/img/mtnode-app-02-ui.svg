<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 222" width="680" height="222">
  <defs>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#38bdf8"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#f59e0b"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#c792ea"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#4ade80"/></marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#fb7185"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#a8b5c8"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="221" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>应用中心：用说话的方式做一个桌面小应用</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>不用从零配开发环境，选好风格就能边聊边改，做好后可独立开窗或上架分享</text>
  <rect x="18" y="68" width="146" height="110" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="19" y="69" width="144" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <text x="91" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>1. 选风格新建</text>
  <text x="91" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>7 套预设视觉风格</text>
  <text x="91" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>或选「自定义」</text>
  <line x1="164" y1="123" x2="192" y2="123" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="192" y="68" width="148" height="110" rx="8" fill="#21182c" stroke="#c792ea" stroke-width="1.5"/>
  <rect x="193" y="69" width="146" height="4" rx="2" fill="#c792ea" opacity="0.85"/>
  <text x="266" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>2. 边聊边改</text>
  <text x="266" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>在开发页会话里</text>
  <text x="266" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>描述想要的界面功能</text>
  <line x1="340" y1="123" x2="368" y2="123" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="368" y="68" width="144" height="110" rx="8" fill="#261d12" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="369" y="69" width="142" height="4" rx="2" fill="#f59e0b" opacity="0.85"/>
  <text x="440" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>3. 实时预览</text>
  <text x="440" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>中栏当场看效果</text>
  <text x="440" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>点「启动」独立开窗</text>
  <line x1="512" y1="123" x2="540" y2="123" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="540" y="68" width="122" height="110" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="541" y="69" width="120" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <text x="601" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>4. 收藏或上架</text>
  <text x="601" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>留在「库」里自用</text>
  <text x="601" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>或上架分享多版本</text>
  <text x="340" y="210" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>应用数据自动存进你自己的数据目录，升级或重装软件都不会丢</text>
</svg>
