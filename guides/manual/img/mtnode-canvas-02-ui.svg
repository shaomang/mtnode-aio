<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 192" width="600" height="192">
  <rect width="600" height="192" fill="#0d1016"/>
  <defs>
  <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f0c14d"/></marker>
  <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38d6ff"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff8f2e"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fd68a"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff6b6b"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c792ea"/></marker>
  </defs>
  <rect x="16" y="44" width="180" height="48" rx="6" fill="#161020" stroke="#c792ea" stroke-width="1.6"/>
  <text x="106" y="65.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">函数节点</text>
  <text x="106" y="78.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">JS：input → return</text>
  <rect x="16" y="120" width="180" height="48" rx="6" fill="#1a1610" stroke="#f0c14d" stroke-width="1.6"/>
  <text x="106" y="141.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">工具节点</text>
  <text x="106" y="154.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">超级节点 + 注册</text>
  <line x1="196" y1="68" x2="250" y2="68" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <line x1="196" y1="144" x2="250" y2="144" stroke="#f0c14d" stroke-width="1.8" marker-end="url(#arr-gold)"/>
  <rect x="250" y="44" width="330" height="124" rx="6" fill="#101820" stroke="#38d6ff" stroke-width="1.6"/>
  <text x="415" y="90.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">参数表 = 端子表</text>
  <text x="415" y="103.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">输入端子 0 = 控制入，1..N 依次是各入参</text>
  <text x="415" y="116.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">输出端子 0..M-1 是各出参，末位是控制出</text>
  <text x="415" y="129.5" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">端子类型 text / image 决定能不能相接</text>
  <text x="16" y="184" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">注册后会话与智能节点可直接调用它，把工作流固化成可复用的能力</text>
  <text x="300" y="180" text-anchor="middle" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">参数表就是端子表：加一个参数就多一个端子</text>
</svg>
