  <rect x="0.5" y="0.5" width="679" height="221" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>研究视图：从零散资料到知识图谱与演示</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>所有笔记与资料都以纯 Markdown 存在你的项目文件夹里，随时可带走</text>
  <rect x="18" y="68" width="142" height="110" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="19" y="69" width="140" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <text x="89" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>1. 投入资料</text>
  <text x="89" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>拖入文稿 / PDF</text>
  <text x="89" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>贴链接或写检索式</text>
  <line x1="160" y1="123" x2="188" y2="123" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="188" y="68" width="148" height="110" rx="8" fill="#21182c" stroke="#c792ea" stroke-width="1.5"/>
  <rect x="189" y="69" width="146" height="4" rx="2" fill="#c792ea" opacity="0.85"/>
  <text x="262" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>2. 精读与笔记</text>
  <text x="262" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>三遍读法拆解</text>
  <text x="262" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>选句批注 / 问 AI</text>
  <line x1="336" y1="123" x2="364" y2="123" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="364" y="68" width="146" height="110" rx="8" fill="#261d12" stroke="#f59e0b" stroke-width="1.5"/>
