  <text x="437" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>3. 知识图谱</text>
  <text x="437" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>看笔记、论断与术语</text>
  <text x="437" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>之间的关联路径</text>
  <line x1="510" y1="123" x2="538" y2="123" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="538" y="68" width="124" height="110" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="539" y="69" width="122" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <text x="600" y="112" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>4. 一键做演示</text>
  <text x="600" y="130" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>排成可放映讲义</text>
  <text x="600" y="144.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>或导出 HTML / 视频</text>
  <text x="340" y="210" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>用 [[笔记名]] 和 [@文献] 写出关联，知识图谱就会自动长出来</text>
