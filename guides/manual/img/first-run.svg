<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160">
  <rect width="580" height="160" fill="#0d1016"/>
  <defs>
  <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f0c14d"/></marker>
  <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38d6ff"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff8f2e"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fd68a"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff6b6b"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c792ea"/></marker>
  </defs>
  <rect x="20" y="48" width="120" height="48" rx="6" fill="#101820" stroke="#38d6ff" stroke-width="1.6"/>
  <text x="80" y="76" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">1 加节点</text>
  <line x1="140" y1="72" x2="172" y2="72" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="172" y="48" width="110" height="48" rx="6" fill="#1a1610" stroke="#f0c14d" stroke-width="1.6"/>
  <text x="227" y="76" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">2 连线</text>
  <line x1="282" y1="72" x2="314" y2="72" stroke="#f0c14d" stroke-width="1.8" marker-end="url(#arr-gold)"/>
  <rect x="314" y="48" width="110" height="48" rx="6" fill="#1a140e" stroke="#ff8f2e" stroke-width="1.6"/>
  <text x="369" y="76" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">3 写 @ 引用</text>
  <line x1="424" y1="72" x2="456" y2="72" stroke="#ff8f2e" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="456" y="48" width="100" height="48" rx="6" fill="#101610" stroke="#5fd68a" stroke-width="1.6"/>
  <text x="506" y="76" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">4 ▶ 运行</text>
  <text x="290" y="148" text-anchor="middle" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">第一次使用：加节点 → 连线 → 写 @ 引用 → ▶ 运行（上游未跑过会自动递归执行）</text>
</svg>
