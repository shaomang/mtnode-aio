<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190">
  <rect width="600" height="190" fill="#0d1016"/>
  <defs>
  <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f0c14d"/></marker>
  <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38d6ff"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff8f2e"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fd68a"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff6b6b"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c792ea"/></marker>
  </defs>
  <rect x="20" y="40" width="120" height="48" rx="6" fill="#101820" stroke="#38d6ff" stroke-width="1.6"/>
  <text x="80" y="68" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">输出端子</text>
  <line x1="140" y1="64" x2="190" y2="64" stroke="#38d6ff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="190" y="40" width="120" height="48" rx="6" fill="#1a140e" stroke="#ff8f2e" stroke-width="1.6"/>
  <text x="250" y="68" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">输入端子</text>
  <text x="20" y="110" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">数据线（青 / 橙 / 绿）：上游结果沿连线成为下游输入</text>
  <line x1="20" y1="130" x2="580" y2="130" stroke="#2a3140" stroke-width="1.8"/>
  <rect x="20" y="146" width="130" height="32" rx="6" fill="#1a1610" stroke="#f0c14d" stroke-width="1.6"/>
  <text x="85" y="166" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">控制线（金色）</text>
  <line x1="150" y1="162" x2="220" y2="162" stroke="#f0c14d" stroke-width="1.8" marker-end="url(#arr-gold)"/>
  <rect x="220" y="146" width="130" height="32" rx="6" fill="#1a1610" stroke="#f0c14d" stroke-width="1.6"/>
  <text x="285" y="166" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">只传脉冲</text>
  <rect x="360" y="146" width="140" height="32" rx="6" fill="#12161e" stroke="#8a94a6" stroke-width="1.6"/>
  <text x="430" y="166" text-anchor="middle" fill="#e8eef6" font-size="12" font-family="Segoe UI,sans-serif">关系线（UML 直线）</text>
  <text x="508" y="166" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">不执行</text>
  <text x="300" y="178" text-anchor="middle" fill="#5a6472" font-size="11" font-family="Segoe UI,sans-serif">三种线：数据线传值 · 金色控制线只传脉冲 · 关系线只表达依赖</text>
</svg>
