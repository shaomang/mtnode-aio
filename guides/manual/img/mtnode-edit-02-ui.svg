<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" height="214">
  <defs>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#38bdf8"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#f59e0b"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#c792ea"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#4ade80"/></marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#fb7185"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#a8b5c8"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="213" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>局部重绘：只改你想改的那一块</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>给图涂上蒙版，蒙版外的画面严格保持不变</text>
  <rect x="18" y="68" width="130" height="104" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="19" y="69" width="128" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <text x="83" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>1. 放入原图</text>
  <text x="83" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>把原图接进</text>
  <text x="83" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>图像节点的第 1 口</text>
  <line x1="148" y1="120" x2="180" y2="120" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <rect x="180" y="68" width="146" height="104" rx="8" fill="#261d12" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="181" y="69" width="144" height="4" rx="2" fill="#f59e0b" opacity="0.85"/>
  <text x="253" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>2. 涂抹蒙版</text>
  <text x="253" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>点开编辑蒙版</text>
  <text x="253" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>擦出要重绘的区域</text>
  <line x1="326" y1="120" x2="358" y2="120" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <rect x="358" y="68" width="152" height="104" rx="8" fill="#21182c" stroke="#c792ea" stroke-width="1.5"/>
  <rect x="359" y="69" width="150" height="4" rx="2" fill="#c792ea" opacity="0.85"/>
  <text x="434" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>3. 写重绘说明</text>
  <text x="434" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>只描述擦掉的地方</text>
  <text x="434" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>想要替换成什么</text>
  <line x1="510" y1="120" x2="542" y2="120" stroke="#c792ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="542" y="68" width="120" height="104" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="543" y="69" width="118" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <text x="602" y="109" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>4. 生成并保存</text>
  <text x="602" y="127" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>自动锁定原图尺寸</text>
  <text x="602" y="141.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>蒙版外像素不动</text>
  <text x="340" y="202" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>提示：蒙版里只写「这块要变成什么」，不要把整张图重新描述一遍</text>
</svg>
