  <rect x="0.5" y="0.5" width="679" height="229" rx="10" fill="#11151d" stroke="#242c3c"/>
  <text x="20" y="28" fill="#f1f5f9" font-size="14" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>接入 AI 模型的三种方式</text>
  <text x="20" y="46" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>在「设置 → 模型服务」里配置，任选一种就能立刻开工</text>
  <rect x="20" y="66" width="200" height="122" rx="8" fill="#12212e" stroke="#38bdf8" stroke-width="1.5"/>
