  <rect x="30" y="78" width="28" height="18" rx="9" fill="#38bdf8" opacity="0.2"/>
  <text x="44" y="90.5" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>推荐</text>
  <text x="120" y="108" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>方式一：填官方 API Key</text>
  <text x="120" y="126" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>去 DeepSeek / 千问 / 智谱 / Kimi</text>
  <text x="120" y="140.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>官网注册 → 创建 Key</text>
  <text x="120" y="155" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>粘贴进「模型服务」即可</text>
  <rect x="240" y="66" width="200" height="122" rx="8" fill="#261d12" stroke="#f59e0b" stroke-width="1.5"/>
