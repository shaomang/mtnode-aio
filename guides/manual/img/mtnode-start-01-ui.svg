  <rect x="250" y="78" width="28" height="18" rx="9" fill="#f59e0b" opacity="0.2"/>
  <text x="264" y="90.5" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>省心</text>
  <text x="340" y="108" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>方式二：MTNode 中转</text>
  <text x="340" y="126" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>登录并充值后自动出现</text>
  <text x="340" y="140.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>免填 Key、模型自动同步</text>
  <text x="340" y="155" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>也可复制给其他软件用</text>
  <rect x="460" y="66" width="200" height="122" rx="8" fill="#12241b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="461" y="67" width="198" height="4" rx="2" fill="#4ade80" opacity="0.85"/>
  <rect x="470" y="78" width="28" height="18" rx="9" fill="#4ade80" opacity="0.2"/>
  <text x="484" y="90.5" text-anchor="middle" fill="#4ade80" font-size="10.5" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>离线</text>
  <text x="560" y="108" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>方式三：本机免费模型</text>
  <text x="560" y="126" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>在顶栏「插件」装 llama.cpp</text>
  <text x="560" y="140.5" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>下载模型跑在自己显卡上</text>
  <text x="560" y="155" text-anchor="middle" fill="#a8b5c8" font-size="11" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>完全离线、不花 API 费用</text>
  <text x="340" y="218" text-anchor="middle" fill="#a8b5c8" font-size="11.5" font-family='system-ui, -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif'>API Key 等同账号与余额凭证，切勿截图或发给他人；所有配置改完自动保存</text>
