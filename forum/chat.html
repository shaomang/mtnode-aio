<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>MTNode 讨论区</title>
<link rel="stylesheet" href="forum.css">
</head>
<body>
  <div class="panel">
    <div class="head">
      <span class="title">MTNode 讨论区<span class="who" id="who"></span></span>
      <div class="btns">
        <button type="button" id="btnOut" title="退出登录" hidden>退</button>
        <button type="button" id="btnClose" title="关闭">×</button>
      </div>
    </div>

    <!-- ① 列表页 -->
    <section class="view" id="viewList">
      <div class="listbar">
        <input id="q" type="search" maxlength="80" placeholder="搜索标题…">
        <select id="sort" title="排序"></select>
        <button type="button" id="btnNew" class="primary">发起话题</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="hintbar" id="hintBar" hidden>
        <span id="hintTxt">登录后可发帖</span>
        <button type="button" id="hintLogin" class="linkbtn">登录</button>
      </div>
      <div class="scroll" id="topicList"></div>
      <div class="morebar" id="moreBar" hidden><button type="button" id="btnMore">加载更多</button></div>
    </section>

    <!-- ② 详情页 -->
    <section class="view" id="viewTopic" hidden>
      <div class="tdhead">
        <button type="button" id="btnBack" class="ghost">← 返回</button>
        <div class="tdtitle" id="tTitle"></div>
        <div class="tdmeta">
          <span class="badge" id="tBadge"></span>
          <span class="tdtime" id="tTime"></span>
          <select id="statusSel" hidden title="切换状态"></select>
        </div>
      </div>
      <div class="scroll" id="topicScroll">
        <div class="md card" id="tBody"></div>
        <div class="rlist" id="replyList"></div>
        <div class="replybox">
          <div class="replyto" id="replyToBar" hidden>
            <span id="replyToTxt"></span>
            <button type="button" id="replyToClear" class="linkbtn">取消</button>
          </div>
          <div class="mdedit" id="replyHost"></div>
          <div class="replyfoot">
            <span class="err" id="replyErr"></span>
            <button type="button" id="btnReply" class="primary">回复</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ③ 登录（复用原有登录表单，浏览不受影响） -->
    <div class="auth" id="auth">
      <h3 id="authTitle">登录后即可发帖</h3>
      <p id="authHint">与创意工坊共用同一账户，token 只保存在本机主进程。</p>
      <div class="modes">
        <button type="button" class="on" id="modeLogin">登录</button>
        <button type="button" id="modePass">修改密码</button>
      </div>
      <div class="err" id="authErr"></div>
      <input id="authUser" type="text" maxlength="24" placeholder="用户名（3-24 位字母、数字或下划线）">
      <input id="authPass" type="password" maxlength="72" placeholder="密码（6-72 位）">
      <input id="authPassNew" type="password" maxlength="72" placeholder="新密码（6-72 位）" hidden>
      <input id="authPassNew2" type="password" maxlength="72" placeholder="再次输入新密码" hidden>
      <div class="modes">
        <button type="button" class="ghost" id="authCancel">继续浏览</button>
        <button type="button" class="go" id="authGo">登录</button>
      </div>
    </div>

    <!-- 发起话题 -->
    <div class="modal" id="compose" hidden>
      <div class="mbox">
        <div class="mtitle" id="cTitleBar">发起话题</div>
        <input id="cTitle" type="text" maxlength="120" placeholder="标题（2-120 字）">
        <div class="mrow">
          <select id="cStatus" title="状态"></select>
        </div>
        <div class="mdedit" id="composeHost"></div>
        <div class="mfoot">
          <span class="err" id="cErr"></span>
          <button type="button" class="ghost" id="cCancel">取消</button>
          <button type="button" class="primary" id="cPost">发布</button>
        </div>
      </div>
    </div>

    <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
