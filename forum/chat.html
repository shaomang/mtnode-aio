<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>MTNode 讨论区</title>
<link rel="stylesheet" href="forum.css">
<!-- 评论复用主应用那一套组件与 DOM（renderer/app-comments.js）：
     样式真源在 renderer/css/，这里只链接同一份文件，不复制一份讨论区专用样式
     （本窗是同一个应用目录下的插件窗口，相对路径可用；forum.css 里已把主应用的
     语义槽位名 --ink / --muted / --yellow 映射到讨论区自己的调色板）。
     打赏（renderer/app-tips.js 与 css/tips.css）已从讨论区整体移除：本窗不再加载、
     不再画打赏入口，这条通道只剩工坊与应用中心两处。 -->
<link rel="stylesheet" href="../renderer/css/comments.css">
</head>
<body>
  <div class="panel">
    <div class="head">
      <!-- 标题栏不再显示当前账号，也没有「退出登录」：登录态唯一入口是顶栏右上角的账户按钮，
           本窗只在登录后才打得开（renderer/app-boot.js 的 #btnForum 按登录态显隐），
           登录一失效本窗就自行关闭（见 chat.js 的 closeForAuthLoss）。 -->
      <span class="title">MTNode 讨论区</span>
      <div class="btns">
        <button type="button" id="btnClose" title="关闭">×</button>
      </div>
    </div>

    <!-- ① 列表页 -->
    <section class="view" id="viewList">
      <div class="listbar">
        <input id="q" type="search" maxlength="80" placeholder="搜索标题…">
        <select id="sort" title="排序"></select>
        <button type="button" id="btnNew" class="primary">发起话题</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="scroll" id="topicList"></div>
      <div class="morebar" id="moreBar" hidden><button type="button" id="btnMore">加载更多</button></div>
    </section>

    <!-- ② 详情页 -->
    <section class="view" id="viewTopic" hidden>
      <div class="tdhead">
        <button type="button" id="btnBack" class="ghost">← 返回</button>
        <div class="tdtitle" id="tTitle"></div>
        <div class="tdmeta">
          <span class="badge" id="tBadge"></span>
          <span class="tdtime" id="tTime"></span>
          <select id="statusSel" hidden title="切换状态"></select>
          <!-- 删帖（本轮需求）：软删除。只有服务端投影 canDelete=true（作者本人 / 管理员）时显示，
               二次确认走 window.confirm，与评论区删除同一套交互。 -->
          <button type="button" id="btnDelTopic" class="danger" hidden title="删除这条话题">删除</button>
        </div>
      </div>
      <div class="tdtabs" id="tdTabs">
        <button type="button" class="tdtab on" id="tdTabReply"
          title="阅读与发表回复（讨论区原有形态）">回复</button>
        <button type="button" class="tdtab" id="tdTabComment"
          title="评价这条话题（评论支持互回；讨论区的话题评论不带星级）">评论</button>
      </div>
      <div class="scroll" id="topicScroll">
        <div class="md card" id="tBody"></div>
        <div class="rlist" id="replyList"></div>
        <div class="replybox">
          <div class="replyto" id="replyToBar" hidden>
            <span id="replyToTxt"></span>
            <button type="button" id="replyToClear" class="linkbtn">取消</button>
          </div>
          <div class="mdedit" id="replyHost"></div>
          <div class="replyfoot">
            <span class="err" id="replyErr"></span>
            <button type="button" id="btnReply" class="primary">回复</button>
          </div>
        </div>
        <!-- 评论页签（renderer/app-comments.js 的评论区整块挂在这里；首次切过去才拉数据） -->
        <div class="cmt-host" id="topicComments" hidden></div>
      </div>
    </section>

    <!-- 本窗不再有登录卡（本轮需求）：全 MTNode 唯一登录入口是顶栏右上角「账户」按钮。
         未登录时连讨论区入口都不显示（renderer/app-boot.js），因此这里既不需要登录表单，
         也不需要「免登录浏览」的提示条；登录态失效时由 chat.js 关窗并把主窗口调到前台。 -->

    <!-- 发起话题 -->
    <div class="modal" id="compose" hidden>
      <div class="mbox">
        <div class="mtitle" id="cTitleBar">发起话题</div>
        <input id="cTitle" type="text" maxlength="120" placeholder="标题（2-120 字）">
        <div class="mrow">
          <select id="cStatus" title="状态"></select>
        </div>
        <div class="mdedit" id="composeHost"></div>
        <div class="mfoot">
          <span class="err" id="cErr"></span>
          <button type="button" class="ghost" id="cCancel">取消</button>
          <button type="button" class="primary" id="cPost">发布</button>
        </div>
      </div>
    </div>

    <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="vendor/marked.min.js"></script>
  <!-- 评论（window.MtComments）：与主应用同一份模块，讨论区用它做话题 / 回复的评论；
       模块只依赖 window.api.storeRequest / MTNodeAuth / I18n（chat.js 顶部已补适配层），
       引用不到这些全局时自带头部有降级，不会把讨论区打崩。
       打赏（app-tips.js）与它要画的鲸圆币元件（app-whalecoin.js）已按本轮需求
       从讨论区一并撤掉，不再加载；评论模块不碰 window.MtCoin / .wl-* 元件。 -->
  <script src="../renderer/app-comments.js"></script>
  <script src="chat.js"></script>
</body>
</html>
