<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file: blob: data:; img-src 'self' file: data: mtnode-thumb: http://mt-agent.com https://mt-agent.com http://www.mt-agent.com https://www.mt-agent.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; frame-src https://open.weixin.qq.com http://mt-agent.com https://mt-agent.com mtnode-preview: https://chat.deepseek.com; connect-src 'self'"><!-- frame-src：微信扫码登录把开放平台 qrconnect 页内嵌在登录对话框里（app-auth.js 的 authQrFrame），
     扫码确认后该页会自己跳到服务端回调域（默认 http://mt-agent.com，见 main.js 的 MTNODE_STORE_URL），两处都要放行。
     frame-src 里的 https://chat.deepseek.com：状态栏 DeepSeek 抽屉（renderer/app-deepseek.js 的
     .ds-webview）装的就是这个官方网页；它是一次跨源子框架导航，与 iframe 同一道 CSP 检查 ——
     不放行时那一步在 Chromium 里就被拦下，抽屉里只剩一片空白（webview 的 did-fail-load 会报
     ERR_BLOCKED_BY_CSP）。这条只放行这一个主机名，不放宽 default-src。
     frame-src 里的 mtnode-preview:：应用中心「开发」页中栏的实时预览 iframe（renderer/app-apps-dev.js 的
     #appsDevFrame）src 就是这个主进程登记的标准 / 安全协议（apps-store.js 的 PREVIEW_SCHEME / registerPreviewProtocol）。
     少放行它 = Chromium 在发出 frame 请求之前就拦掉这次导航（协议层根本收不到请求），
     iframe 停在 about:blank、中栏只剩白底 —— 表现就是「预览未显示默认界面」。
     img-src 里的 mtnode-thumb: 是画布图片预览的缩略图协议（assets-store.js 的 registerThumbProtocol）：
     预览位按「显示尺寸」取图（长边 ≤640），别让原图直接进 <img> —— 解出来的位图由 GPU 进程按源分辨率
     建纹理，而这类纹理只有渲染进程销毁才归还（实测重启前后 3151MB → 265MB）。少放行它 = 所有节点图片预览
     被 Chromium 在发请求之前就拦掉（控制台报 violates ... img-src），表现是画布上图片位全空白。
     img-src 里的 mt-agent.com / www.mt-agent.com：应用中心的封面与图标都是云端图，只能靠它显示
     （renderer/app-apps.js 的 appsIconUrl / appsThumbUrlOf；加载失败一律回落成首字母占位块）。
     **两个主机名都必须列**：CSP 的 host-source 是精确主机名匹配，**不含子域**（只写 `mt-agent.com`
     匹配不到 `www.mt-agent.com`），而线上 nginx 把 `http://mt-agent.com` 与裸域一律 301 到
     `https://www.mt-agent.com` —— 只列裸域时，每一次取图都在**跳转那一跳**被拦掉（控制台报
     "Loading the image 'https://www.mt-agent.com/…' violates …"），表现就是「截图传上去了、
     应用商店却拿不到封面」（2026-10-09 用户报的正是这句）。这是本文件唯一一处放行云端图的地方，
     改动前先想清楚「哪一跳会被检查」。
     图标 / 封面 URL 由主进程 apps-store.js 按目录**来源**算好：
     静态目录 = http://mt-agent.com/mtnode/apps/icons/<主干>[__shot].png，云端接口兜底 =
     …/mtnode/store-api/api/apps/<id>/icon|thumb，
     两者都在放行的这两个主机之下；目录正文仍由主进程拉取并缓存，渲染层不直连网络。
     media-src 的 blob:：语音播报（renderer/app-tts.js 的 wavUrlOf）把 worker 在内存里编好的 wav
     拼成 blob URL 交给 <audio>，不放行 blob: 时 media-src 回落到 default-src 'self'，Chromium 在读源之前
     就拦掉（audio.error = MEDIA_ELEMENT_ERROR: Media load rejected by URL safety check），
     表现就是「开关开着、字幕也在走，却一点声音都没有」。file: 留给老宿主给的 file:// 音频。
     'unsafe-eval' 暂保留：函数节点的用户 JS 已改到主进程独立线程执行（fn-runtime.js，见 renderer/js-exec.js），渲染层不再 new Function —— 本指令只作兼容余量，不再承载函数节点能力 -->
<title>MTNode AI工作站</title>
<link rel="stylesheet" href="style.css">
<!-- AI 事实库（renderer/app-ai-facts.js 的查阅弹窗 + 左栏那一行）的样式：
     style.css 内部按 @import 串起 css/*.css，本文件独立成一份、用 <link> 跟在它后面
     （晚于 style.css 生效，同优先级时以本文件为准）；配色一律用 base.css 的主题变量，
     不新造配色体系。 -->
<link rel="stylesheet" href="css/ai-facts.css">
<!-- 研究画布（renderer/app-research.js / app-research-graph.js / app-pele.js 的样式）：
     与上面几份同一写法 —— 独立成一份、用 <link> 跟在 style.css 之后，配色只取 base.css
     的主题变量（暗色 / 工业 / 亮色三套自动跟随）。 -->
<link rel="stylesheet" href="css/research.css">
<!-- 研究视图「演示（PPT）」的样式：编辑器三栏浮层 + 放映 / 导出用的页标记。
     前缀只有 .rs-slide* / .rs-deck*，变量挂在 --rs-slide-*（取不到才回落 --panel / --ink / --bd），
     与上面那份 research.css 互不覆盖 —— 它是独立一份，跟在 research.css 之后加载。 -->
<link rel="stylesheet" href="css/research-slides.css">
<!-- KaTeX 公式排版样式（vendor/katex/，含 fonts/）：字形位置全靠这份 CSS 定位，
     与 vendor/katex/katex.min.js 成对出现；本文件与 pdf-print.html 必须同步挂载。 -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<!-- 上架应用浮层（renderer/app-publish.js 的 window.openAppPublish）的样式：
     窗框尺寸走 .overlay-box.app-publish-box（近全屏 / 最小宽 50vw / 右下角拖拽手柄），
     其余是「上架」窗自己的字段 / 截图 / 版本 / 配额 / 结果块版式；配色一律用 base.css
     的主题变量（亮色主题自动跟随）。与 ai-facts.css 同一写法：本文件独立成一份、用 <link>
     跟在 style.css 之后（晚于 style.css 生效，同优先级时以本文件为准）。 -->
<link rel="stylesheet" href="css/app-publish.css">
<!-- 消息（renderer/app-messages.js 的 window.MtMessages + css/messages.css）：顶栏「消息」入口
     的三态 / 未读角标，以及消息窗（打赏 / 评论 / 回复三类日志）的列表版式。
     与上面两份同一写法：独立成一份、用 <link> 跟在 style.css 之后（css/*.css 走 style.css
     的 @import，这一份不改 style.css）；配色一律用 base.css 的主题变量。 -->
<link rel="stylesheet" href="css/messages.css">
<!-- 状态栏右下角的点阵小人（renderer/app-footer-mascot.js）：与上面几份同一写法，
     独立成一份、用 <link> 跟在 style.css 之后；画面取自用户给的像素参考表原图
     （renderer/img/footer-mascot.png），本文件只管 32×24 的排版。 -->
<link rel="stylesheet" href="css/footer-mascot.css">
<!-- 状态栏「重新编译并重启」按钮（renderer/app-self-rebuild.js）：与上面同一写法，
     独立成一份；只排版那颗 22×22 的图标按钮与它的悬停 / 禁用态。 -->
<link rel="stylesheet" href="css/self-rebuild.css">
<!-- 画布录制按钮（renderer/app-take-ui.js）：状态栏左下角四颗按钮之后那颗「● 录制」、
     录制中的暂停 / 停止两枚小按钮，以及停止后左下角那条带「打开」的提示条。
     与上面几份同一写法：独立成一份、用 <link> 跟在 style.css 之后，配色只取
     base.css 的主题变量（亮色主题自动跟随）。 -->
<link rel="stylesheet" href="css/take-ui.css">
<link rel="stylesheet" href="css/tts.css">
<!-- 任务完成的应用内卡片（renderer/app-notify.js）：右下角浮层，兜底系统通知
     （系统勿扰 / 开发态通知不弹时仍然看得见）。独立成一份，配色走 base.css 的变量。 -->
<link rel="stylesheet" href="css/notify.css">
<!-- DeepSeek 对话抽屉（renderer/app-deepseek.js 的右侧浮层 + 状态栏入口 #btnDeepSeek）：
     与上面几份同一写法 —— 独立成一份、用 <link> 跟在 style.css 之后（晚于 style.css 生效，
     同优先级时以本文件为准）；配色一律用 base.css 的主题变量（亮色主题自动跟随）。 -->
<link rel="stylesheet" href="css/deepseek.css">
</head>
<body>

<header class="topbar">
  <div class="tb-row tb-row-1">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-txt"><span data-i18n="MTNode AI工作站">MTNode AI工作站</span><span class="logo-sub" id="logoSub"></span></span>
    </div>
    <!-- 「数据不落应用文件夹」警示：紧跟在 Logo 右侧（第一行中段，自动边距居中于 Logo 与右端
         按钮之间，太窄只截断不遮挡）。**默认 hidden**：只有主进程只读体检（app:dataAudit，
         与启动体检 auditAppDirData 同口径）真的查到有数据落在应用文件夹内才由
         renderer/app-boot.js 的 paintAppDirWarn() 显示并填 tooltip；文案与 tooltip 一律
         由 JS 按 I18n.t 现算（故不挂 data-i18n，避免切语言时被 applyDom 写掉明细）。
         点击 = 打开设置并滚到「配置数据目录」小节（数据文件夹位置在那里改）。 -->
    <button type="button" id="logoWarn" class="logo-warn" hidden aria-hidden="true" tabindex="-1" aria-label="">
      <svg class="logo-warn-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.6L14.4 13.4H1.6L8 2.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.6v3.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".85" fill="currentColor"/></svg>
      <span class="logo-warn-txt" id="logoWarnTxt"></span>
    </button>
    <div class="tb-end">
      <!-- 「消息」= 打赏 / 评论 / 回复三类日志（renderer/app-messages.js 的 window.MtMessages +
            css/messages.css），位置**紧贴「应用」#btnApps 左边**。三态：
             未登录 / 未读数接口不可用 / 一条消息都没有 → 置灰不可点（title 说明原因，
             如「登录后可看消息」）；有消息（含已读但没清空）→ 可点，右上角角标显示未读数
             （>99 → 99+，0 时隐藏）。点开 = 消息窗（#overlay，persistent + 可最小化）。
           默认 disabled：脚本接管前先如实呈现「还不能点」。 -->
      <button type="button" id="btnMessages" class="corner mini btn-stack btn-messages" disabled data-i18n-title="消息：打赏 / 评论 / 回复" title="消息：打赏 / 评论 / 回复" aria-label="消息">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 3.4h10.8v7.2H8.4L5.2 13.2v-2.6H2.6z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M5.4 6.2h5.2M5.4 8.4h3.2" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        <span class="btn-stack-txt" data-i18n="消息">消息</span>
        <span class="btn-lang-badge btn-msg-badge" id="btnMessagesBadge" hidden></span>
      </button>
      <!-- 「应用」= 应用中心（renderer/app-apps.js 的 openAppsHub）：主窗口内整屏浮层页，
           左导航「应用 / 库 / 开发」，云端目录下载 zip（sha256 校验）解包到应用根目录，
           已下载的应用开独立窗口运行。**只对白名单账号露出**（app-apps.js 的
           APPS_USER_WHITELIST，当前 ms2308）：默认 hidden，登录态变化时由它同步显隐。
           不挂 data-shortcut —— 它是白名单入口，不占全局单键。 -->
      <button type="button" id="btnApps" class="corner mini btn-stack btn-apps" hidden aria-hidden="true" data-i18n-title="应用：浏览云端应用目录，下载到本机后用独立窗口运行（已下载的应用在「库」里管理）" title="应用：浏览云端应用目录，下载到本机后用独立窗口运行（已下载的应用在「库」里管理）" aria-label="应用">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="8.8" y="2.2" width="4.8" height="4.8" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="2.2" y="8.8" width="4.8" height="4.8" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M11.2 8.6v5.2M8.8 11.4l2.4 2.4 2.4-2.4" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-stack-txt" data-i18n="应用">应用</span>
      </button>
      <button type="button" id="btnDocs" class="corner mini btn-stack btn-docs" data-i18n-title="使用手册：界面说明与常见问题" title="使用手册：界面说明与常见问题">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 2.6h7.4A1.4 1.4 0 0 1 12.2 4v9.2H4.6A1.2 1.2 0 0 1 3.4 12V2.6z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M12.2 13.2h.8V4.4A1.4 1.4 0 0 0 11.6 3" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/><path d="M5.6 5.2h4.2M5.6 7.4h4.2M5.6 9.6h2.6" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        <span class="btn-stack-txt" data-i18n="文档">文档</span>
      </button>
      <!-- 讨论区入口：只在**已登录**时显示（renderer/app-auth.js 的 paintEntry 按登录态切 hidden），
           未登录时连入口都不给 —— 讨论区不再有登录入口，全 MTNode 唯一登录 = 上面的账户按钮。
           初值 hidden：首绘（登录态还没回来）不闪一下未登录态的入口。
           hidden 要真收得起来：css/layout.css 的 .topbar .btn-forum[hidden] 必须压回 display:none
           （.btn-stack 的 display:flex 会盖掉浏览器默认 [hidden]，同 .btn-apps / .btn-account）。 -->
      <button type="button" id="btnForum" class="corner mini btn-stack btn-forum" hidden data-i18n-title="MTNode 讨论区：登录后可浏览话题与回复、发话题、回帖并改状态（与创意工坊同一账户）" title="MTNode 讨论区：登录后可浏览话题与回复、发话题、回帖并改状态（与创意工坊同一账户）" aria-label="讨论区">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 3.4h7.2c.8 0 1.4.6 1.4 1.4v4c0 .8-.6 1.4-1.4 1.4H7.2L4.6 12.6V10.2H3.2c-.8 0-1.4-.6-1.4-1.4v-4c0-.8.6-1.4 1.4-1.4z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M9.4 6.8h3.4c.6 0 1.1.5 1.1 1.1v3.2c0 .6-.5 1.1-1.1 1.1h-.8v1.6L10.4 12.2H9.4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round" opacity=".85"/></svg>
        <span class="btn-stack-txt" data-i18n="讨论">讨论</span>
      </button>
      <button type="button" id="btnApprovals" class="corner mini btn-stack btn-approvals" data-i18n-title="审批与权限：权限预设 / 工具许可 / 识图许可，可随时调整" title="审批与权限：权限预设 / 工具许可 / 识图许可，可随时调整">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4l5.2 2.2v3.6c0 3.2-2.2 5.2-5.2 6.2-3-1-5.2-3-5.2-6.2V4.6L8 2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.6 8.1l1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-stack-txt" data-i18n="审批">审批</span>
      </button>
      <!-- 顶栏账户入口已启用：当前开「微信扫码登录 / 绑定微信」与「账号密码登录」，
           手机验证码登录 / 绑定手机暂时隐藏；开放哪几种方式由 renderer/app-auth.js 的
           METHOD_ON 单一真源决定（全关时 init 会把 hidden 设回来） -->
      <button type="button" id="btnAccount" class="corner mini btn-stack btn-account" data-i18n-title="账户：登录 / 绑定 / 退出" title="账户：登录 / 绑定 / 退出" aria-label="账户">
        <span class="btn-stack-txt" id="acctName" data-i18n="登录">登录</span>
      </button>
      <button type="button" id="btnUpdate" class="corner mini btn-update" hidden aria-hidden="true" data-i18n-title="发现新版本，点击下载更新" title="发现新版本，点击下载更新">
        <svg class="btn-update-ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.5v8.2M8 9.7l-2.6-2.6M8 9.7l2.6-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

           静态文案已删 —— 真正的悬停提示由 app-boot.js 的 paintLangBtn() 现算
           （「切换为英文 / 智能会话与节点的回复语言会跟随此设置」），随语言与状态更新。 -->
      <button type="button" id="btnLang" class="corner mini btn-lang" aria-label="切换为英文">

          <ellipse cx="8" cy="8" rx="2.55" ry="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>

  </div>
  <div class="tb-row tb-row-2 actions">
    <!-- 画布 / 会话 / 专家团：与顶栏其它入口同风格「图标在上 · 文字在下」。
         文字必须留在 span[data-i18n] 上，不能挂在 button[data-i18n] —— I18n.applyDom 对
         [data-i18n] 是 el.textContent = t(key)，挂按钮上会在切语言时把图标一起抹掉。
         图标 14px 比两字标题（25px）窄，所以按钮外框尺寸不变（高度仍 32px、内边距不变）。
         这三颗**不挂 data-shortcut**：原先的 1 / 2 / 3 单键会在打字或盲按时把整个视图切走，
