<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>MTNode AI编排器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="tb-row tb-row-1">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-txt"><span data-i18n="MTNode AI编排器">MTNode AI编排器</span><span class="logo-sub" id="logoSub"></span></span>
    </div>
    <div class="tb-end">
      <button type="button" id="btnDocs" class="corner mini btn-stack btn-docs" data-i18n-title="使用手册：界面说明与常见问题" title="使用手册：界面说明与常见问题">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 2.6h7.4A1.4 1.4 0 0 1 12.2 4v9.2H4.6A1.2 1.2 0 0 1 3.4 12V2.6z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M12.2 13.2h.8V4.4A1.4 1.4 0 0 0 11.6 3" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/><path d="M5.6 5.2h4.2M5.6 7.4h4.2M5.6 9.6h2.6" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        <span class="btn-stack-txt" data-i18n="文档">文档</span>
      </button>
      <button type="button" id="btnPlugins" class="corner mini btn-stack btn-plugins" data-i18n-title="插件：云端目录更新，讨论区与桌宠等按需下载" title="插件：云端目录更新，讨论区与桌宠等按需下载">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 2.6v2.2H4.4A1.4 1.4 0 0 0 3 6.2v1.6h2.2v2.4H3v1.6A1.4 1.4 0 0 0 4.4 13.2h1.8v2.2h2.4v-2.2h1.6A1.4 1.4 0 0 0 11.6 11.8V10.2H9.4V7.8h2.2V6.2A1.4 1.4 0 0 0 10.2 4.8H8.6V2.6H6.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span class="btn-stack-txt" data-i18n="插件">插件</span>
      </button>
      <button type="button" id="btnApprovals" class="corner mini btn-stack btn-approvals" data-i18n-title="审批与权限：权限预设 / 工具许可 / 识图许可，可随时调整" title="审批与权限：权限预设 / 工具许可 / 识图许可，可随时调整">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4l5.2 2.2v3.6c0 3.2-2.2 5.2-5.2 6.2-3-1-5.2-3-5.2-6.2V4.6L8 2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.6 8.1l1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-stack-txt" data-i18n="审批">审批</span>
      </button>
      <button type="button" id="btnUpdate" class="corner mini btn-update" hidden aria-hidden="true" data-i18n-title="发现新版本，点击下载更新" title="发现新版本，点击下载更新">
        <svg class="btn-update-ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.5v8.2M8 9.7l-2.6-2.6M8 9.7l2.6-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 11.5v1.2c0 .7.6 1.3 1.3 1.3h8.4c.7 0 1.3-.6 1.3-1.3v-1.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
        </svg>
        <span class="btn-update-txt" data-i18n="更新">更新</span>
      </button>
      <button type="button" id="btnLang" class="corner mini btn-lang" title="切换为英文" aria-label="切换为英文">
        <svg class="btn-lang-globe" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.35"/>
          <ellipse cx="8" cy="8" rx="2.55" ry="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M1.8 8h12.4M3.1 4.8h9.8M3.1 11.2h9.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span class="btn-lang-badge" id="btnLangBadge">中</span>
      </button>
    </div>
  </div>
  <div class="tb-row tb-row-2 actions">
    <button id="btnToolWf" class="corner on tb-view" data-i18n="画布" data-i18n-title="AI 画布编排：画布式节点编排" title="AI 画布编排：画布式节点编排">画布</button>
    <button id="btnToolAgent" class="corner tb-view" data-i18n="会话" data-i18n-title="智能会话：全屏 agent 会话画布（等于常驻的智能任务）" title="智能会话：全屏 agent 会话画布（等于常驻的智能任务）">会话</button>
    <span class="sep"></span>
    <button id="btnUndo" class="corner mini btn-ico" data-i18n-title="撤销（Ctrl+Z）" data-tip="撤销（Ctrl+Z）" aria-label="撤销">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 6.2h6.2a3.4 3.4 0 1 1 0 6.8H7.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.6 3.6L3 6.2l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-ico-txt" data-i18n="撤销">撤销</span>
    </button>
    <button id="btnRedo" class="corner mini btn-ico" data-i18n-title="重做（Ctrl+Y / Ctrl+Shift+Z）" data-tip="重做（Ctrl+Y / Ctrl+Shift+Z）" aria-label="重做">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.8 6.2H6.6a3.4 3.4 0 1 0 0 6.8H8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10.4 3.6L13 6.2l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-ico-txt" data-i18n="重做">重做</span>
    </button>
    <button id="btnFit" class="corner mini btn-ico" data-i18n-title="一键居中：缩放并定位到全部节点" data-tip="一键居中：缩放并定位到全部节点" aria-label="居中">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.2V2.5H5.2M10.8 2.5h2.7V5.2M13.5 10.8v2.7H10.8M5.2 13.5H2.5V10.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="5.2" y="5.2" width="5.6" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
      <span class="btn-ico-txt" data-i18n="居中">居中</span>
    </button>
    <button id="btnGroup" class="corner mini btn-ico" data-i18n-title="组：把选中的节点组成一个组（快捷键 G）；选中组后再次点击解散" data-tip="组：把选中的节点组成一个组（快捷键 G）；选中组后再次点击解散" aria-label="组">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="3.2" width="7.2" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-dasharray="2 1.4"/><rect x="6.4" y="7" width="7.2" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span class="btn-ico-txt" data-i18n="组">组</span>
    </button>
    <button id="btnWrapSuper" class="corner mini btn-ico" data-i18n-title="超节点：将选中节点合并为展开的超级节点（覆盖选区范围）" data-tip="超节点：将选中节点合并为展开的超级节点（覆盖选区范围）" aria-label="超节点">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.15" opacity=".85"/><path d="M5.6 8h4.8M8 5.6v4.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="超节点">超节点</span>
    </button>
    <button id="btnAutoLayout" class="corner mini btn-ico" data-i18n-title="一键排版：按连线关系整理节点位置；可选同时排版超级节点内部（可撤销）" data-tip="一键排版：按连线关系整理节点位置；可选同时排版超级节点内部（可撤销）" aria-label="排版">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="2.4" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="9.2" y="2.4" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="2.4" y="9.2" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="9.2" y="9.2" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
      <span class="btn-ico-txt" data-i18n="排版">排版</span>
    </button>
    <input id="wfName" class="fn-search tb-wfname" type="text" data-i18n-placeholder="画布名称…" placeholder="画布名称…" style="display:none">
    <span class="sep"></span>
    <button id="btnNewWf" class="corner mini btn-ico" data-i18n-title="新建画布" data-tip="新建画布" aria-label="新建">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="新建">新建</span>
    </button>
    <select id="wfSelect" class="wf-select" data-i18n-title="打开画布" title="打开画布"></select>
    <button id="btnRenameWf" class="corner mini btn-ico" data-i18n-title="更改当前画布名称" data-tip="更改当前画布名称" aria-label="改名">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 3.4l3.2 3.2L5.6 13.6H2.4v-3.2L9.4 3.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.2 4.6l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="改名">改名</span>
    </button>
    <button id="btnImport" class="corner mini btn-ico" data-i18n-title="导入画布：从 .mtnodes 文件恢复完整画布" data-tip="导入画布：从 .mtnodes 文件恢复完整画布" aria-label="导入">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.8v8M5.2 8.2L8 11l2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.2v1.6c0 .7.6 1.2 1.2 1.2h7.6c.7 0 1.2-.5 1.2-1.2v-1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="导入">导入</span>
    </button>
    <button id="btnExport" class="corner mini btn-ico" data-i18n-title="导出画布：把当前画布（含图像等资产）打包为 .mtnodes 文件，可迁移到其他电脑" data-tip="导出画布：把当前画布（含图像等资产）打包为 .mtnodes 文件，可迁移到其他电脑" aria-label="导出">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.8V2.8M5.2 5.4L8 2.6l2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.2v1.6c0 .7.6 1.2 1.2 1.2h7.6c.7 0 1.2-.5 1.2-1.2v-1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="导出">导出</span>
    </button>
    <button id="btnDelWf" class="corner mini btn-ico btn-del-wf" data-i18n-title="删除当前画布" data-tip="删除当前画布" aria-label="删除">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 4.6h9.2M6.2 4.6V3.5h3.6v1.1M5.2 4.6l.6 8h4.4l.6-8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-ico-txt" data-i18n="删除">删除</span>
    </button>
    <span class="sep"></span>
    <button id="btnStore" class="corner mini btn-ico btn-store" data-i18n-title="创意工坊：浏览 / 下载公开模板与 Skill，登录后可上传与管理自己的条目" data-tip="创意工坊：浏览 / 下载公开模板与 Skill，登录后可上传与管理自己的条目" aria-label="工坊">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 6.2L4 3.2h8l1.4 3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M3 6.2h10v6.2c0 .6-.5 1.1-1.1 1.1H4.1c-.6 0-1.1-.5-1.1-1.1V6.2z" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M6.2 9.2h3.6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="工坊">工坊</span>
    </button>
    <button id="btnForum" class="corner mini btn-ico btn-forum" data-i18n-title="MTNode 讨论区：与创意工坊同一账户，登录后聊天并同步近 3 天消息" data-tip="MTNode 讨论区：与创意工坊同一账户，登录后聊天并同步近 3 天消息" aria-label="讨论">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 3.4h7.2c.8 0 1.4.6 1.4 1.4v4c0 .8-.6 1.4-1.4 1.4H7.2L4.6 12.6V10.2H3.2c-.8 0-1.4-.6-1.4-1.4v-4c0-.8.6-1.4 1.4-1.4z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M9.4 6.8h3.4c.6 0 1.1.5 1.1 1.1v3.2c0 .6-.5 1.1-1.1 1.1h-.8v1.6L10.4 12.2H9.4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round" opacity=".85"/></svg>
      <span class="btn-ico-txt" data-i18n="讨论">讨论</span>
    </button>
    <span class="sep"></span>
    <button id="btnSettings" class="corner mini btn-ico btn-settings" data-i18n-title="APIs/Config 全局配置：API Key 与接口地址，所有模型节点自动读取" data-tip="APIs/Config 全局配置：API Key 与接口地址，所有模型节点自动读取" aria-label="设置">
      <svg class="btn-settings-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 2.6h3.2l.4 1.5 1.4.8 1.5-.3 1.6 2.8-1.1 1.1v1.6l1.1 1.1-1.6 2.8-1.5-.3-1.4.8-.4 1.5H6.4l-.4-1.5-1.4-.8-1.5.3L1.5 10.2l1.1-1.1V7.5L1.5 6.4l1.6-2.8 1.5.3 1.4-.8.4-1.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
      <span class="btn-ico-txt" data-i18n="设置">设置</span>
    </button>
  </div>
</header>

<div class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <input id="sideFilter" type="text" data-i18n-placeholder="筛选节点或绘图…" placeholder="筛选节点或绘图…">
    </div>
    <div class="sidebar-tree" id="sideTree"></div>
  </aside>
  <section class="pane">
    <div class="wf-wrap" id="wfWrap">
      <div class="fn-toolbar">
        <button id="btnSidebar" class="corner mini btn-sq" data-i18n-title="节点与绘图列表边栏" title="节点与绘图列表边栏">☰</button>
        <div id="taskCrumb" class="task-crumb" hidden></div>
        <div id="wfTabs" class="wf-tabs"></div>
        <div id="wfWsBox" class="wf-ws-box"></div>
        <button id="btnAssist" class="corner mini btn-sq" data-i18n-title="全局 AI 助手（右侧栏）" title="全局 AI 助手（右侧栏）">✦</button>
      </div>
      <div id="canvas" class="fn-canvas">
        <div id="stage" class="fn-stage">
          <svg id="wfSvg" class="fn-svg"></svg>
        </div>
      </div>
    </div>
    <div class="agent-pane" id="agentPane" style="display:none">
      <div class="agent-head">
        <button id="agentSidebarBtn" class="corner mini btn-sq" data-i18n-title="会话列表边栏（按工作目录归类）" title="会话列表边栏（按工作目录归类）">☰</button>
        <div class="agent-title-block">
          <span class="agent-title" data-i18n="智能会话">智能会话</span>
          <span class="agent-sub">DeepSeek Harness</span>
        </div>
        <div class="agent-ctrl">
          <label class="agent-ctrl-item"><span data-i18n="预设">预设</span>
            <select id="agentPresetSel">
              <option value="standard" data-i18n="通用助手">通用助手</option>
              <option value="minimal" data-i18n="精简执行">精简执行</option>
              <option value="code" data-i18n="代码专家">代码专家</option>
              <option value="cordis" data-i18n="Cordis 插件开发">Cordis 插件开发</option>
            </select>
          </label>
          <label class="agent-ctrl-item"><span data-i18n="供应商">供应商</span>
            <select id="agentProvSel"></select>
          </label>
          <label class="agent-ctrl-item"><span data-i18n="模型">模型</span>
            <select id="agentModelSel"></select>
          </label>
          <label class="agent-ctrl-item"><span data-i18n="思考强度">思考强度</span>
            <select id="agentEffortSel">
              <option value="high" data-i18n="标准">标准</option>
              <option value="max" data-i18n="最强">最强</option>
            </select>
          </label>
          <span class="agent-ctrl-item agent-ctx" id="agentCtx" data-i18n-title="上下文用量(最近一次运行的输入 token)" title="上下文用量(最近一次运行的输入 token)"></span>
          <button id="agentNew" class="mini" data-i18n="＋ 新会话" data-i18n-title="新建会话(沿用当前工作目录)">＋ 新会话</button>
          <button id="btnAssistAgent" class="mini btn-sq" data-i18n-title="全局 AI 助手（右侧栏）" title="全局 AI 助手（右侧栏）">✦</button>
        </div>
        <div class="agent-ws-line">
          <span class="agent-ws-label" data-i18n="工作目录">工作目录</span>
          <input id="agentWsInput" type="text" data-i18n-placeholder="留空 = 应用默认数据目录…" placeholder="留空 = 应用默认数据目录…">
          <button id="agentWsOpen" class="mini btn-sq" type="button" data-i18n-title="在资源管理器中打开该文件夹" title="在资源管理器中打开该文件夹">📂</button>
          <button id="agentWsBrowse" class="mini btn-sq ws-browse" type="button" data-i18n-title="设置项目目的地文件夹" title="设置项目目的地文件夹" aria-label="设置项目目的地文件夹"></button>
        </div>
      </div>
      <div class="agent-body">
        <div class="agent-list" id="agentList"></div>
        <div class="agent-cmd-hint" id="agentCmdHint" data-i18n="命令:输入 / 呼出技能与命令 · /new 新会话 · /compact 压缩上文 · /plan 规划 · /rename 改名 · /export 导出 · /permissions 权限预设 · /help">命令:输入 / 呼出技能与命令 · /new 新会话 · /compact 压缩上文 · /plan 规划 · /rename 改名 · /export 导出 · /permissions 权限预设 · /help</div>
        <div class="agent-input-row">
          <textarea id="agentInput" class="chat-input" rows="2" data-i18n-placeholder="描述任务…（Enter 发送，Shift+Enter 换行）" placeholder="描述任务…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="agentSend" class="mini primary">执行</button>
        </div>
      </div>
    </div>
  </section>
  <aside class="assist-pane" id="assistPane" aria-label="全局 AI 助手">
    <div class="assist-resize" id="assistResize" data-i18n-title="拖动边框中部调整助手栏宽度" title="拖动边框中部调整助手栏宽度"></div>
    <div class="assist-head">
      <b data-i18n="全局助手">全局助手</b>

      <button type="button" id="btnAssistClear" class="mini" data-i18n="清空" data-i18n-title="清空助手对话">清空</button>
      <button type="button" id="btnAssistClose" class="mini btn-sq" data-i18n-title="关闭右侧助手栏" title="关闭右侧助手栏">✕</button>
    </div>
    <div class="assist-ctrl" id="assistCtrl">
      <label class="assist-ctrl-item"><span data-i18n="预设">预设</span>
        <select id="assistPresetSel">
          <option value="standard" data-i18n="通用助手">通用助手</option>
          <option value="minimal" data-i18n="精简执行">精简执行</option>
          <option value="code" data-i18n="代码专家">代码专家</option>
          <option value="cordis" data-i18n="Cordis 插件开发">Cordis 插件开发</option>
        </select>
      </label>
      <label class="assist-ctrl-item"><span data-i18n="供应商">供应商</span>
        <select id="assistProvSel"></select>
      </label>
      <label class="assist-ctrl-item"><span data-i18n="模型">模型</span>
        <select id="assistModelSel"></select>
      </label>
      <label class="assist-ctrl-item"><span data-i18n="思考强度">思考强度</span>
        <select id="assistEffortSel">
          <option value="high" data-i18n="标准">标准</option>
          <option value="max" data-i18n="最强">最强</option>
        </select>
      </label>
    </div>
    <div class="assist-ws-line">
      <span class="assist-ws-label" data-i18n="工作范围">工作范围</span>
      <select id="assistScopeSel" class="assist-scope-sel" data-i18n-title="限制助手可访问的画布范围" title="限制助手可访问的画布范围"></select>
    </div>
    <div class="assist-ws-line">
      <span class="assist-ws-label" data-i18n="工作目录">工作目录</span>
      <input id="assistWsInput" type="text" data-i18n-placeholder="留空 = 当前画布 / 应用默认目录…" placeholder="留空 = 当前画布 / 应用默认目录…">
      <button id="assistWsOpen" class="mini btn-sq" type="button" data-i18n-title="在资源管理器中打开该文件夹" title="在资源管理器中打开该文件夹">📂</button>
      <button id="assistWsBrowse" class="mini btn-sq ws-browse" type="button" data-i18n-title="设置项目目的地文件夹" title="设置项目目的地文件夹" aria-label="设置项目目的地文件夹"></button>
    </div>
    <div class="assist-live2d" id="assistLive2d" hidden>
      <div class="assist-live2d-slot" id="assistLive2dSlot">
        <div class="assist-live2d-ph">
          <span class="assist-live2d-mark">Live2D</span>
          <span data-i18n="预留位 · 可接入角色模型">预留位 · 可接入角色模型</span>
        </div>
      </div>
    </div>
    <div class="assist-list" id="assistList"></div>
    <div class="assist-input-row">
      <textarea id="assistInput" class="chat-input" rows="2" data-i18n-placeholder="问助手…（Enter 发送，Shift+Enter 换行；输入 / 呼出技能）" placeholder="问助手…（Enter 发送，Shift+Enter 换行；输入 / 呼出技能）"></textarea>
      <button id="assistSend" class="mini primary" data-i18n="发送">发送</button>
    </div>
  </aside>
</div>
