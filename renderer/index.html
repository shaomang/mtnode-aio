<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; frame-src https://open.weixin.qq.com http://mt-agent.com https://mt-agent.com; connect-src 'self'"><!-- frame-src：微信扫码登录把开放平台 qrconnect 页内嵌在登录对话框里（app-auth.js 的 authQrFrame），
     扫码确认后该页会自己跳到服务端回调域（默认 http://mt-agent.com，见 main.js 的 MTNODE_STORE_URL），两处都要放行。
     'unsafe-eval' 暂保留：函数节点的用户 JS 已改到主进程独立线程执行（fn-runtime.js，见 renderer/js-exec.js），渲染层不再 new Function —— 本指令只作兼容余量，不再承载函数节点能力 -->
<title>MTNode AI编排器</title>
<link rel="stylesheet" href="style.css">
<!-- KaTeX 公式排版样式（vendor/katex/，含 fonts/）：字形位置全靠这份 CSS 定位，
     与 vendor/katex/katex.min.js 成对出现；本文件与 pdf-print.html 必须同步挂载。 -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>

<header class="topbar">
  <div class="tb-row tb-row-1">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-txt"><span data-i18n="MTNode AI编排器">MTNode AI编排器</span><span class="logo-sub" id="logoSub"></span></span>
    </div>
    <div class="tb-end">
      <button type="button" id="btnPuzzle" class="corner mini btn-stack btn-puzzle" data-i18n-title="益智小游戏：等待 AI 工作时玩几款小游戏打发时间" title="益智小游戏：等待 AI 工作时玩几款小游戏打发时间" aria-label="益智小游戏">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 12.5V4.6h3.1V2.4h2.8v2.2h3.1v3.1h-1.6a1.4 1.4 0 0 0 0 2.8h1.6v1.2H9.4v1.8H6.6V12.5H3.5z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>
        <span class="btn-stack-txt" data-i18n="游戏">游戏</span>
      </button>
      <button type="button" id="btnDocs" class="corner mini btn-stack btn-docs" data-i18n-title="使用手册：界面说明与常见问题" title="使用手册：界面说明与常见问题">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 2.6h7.4A1.4 1.4 0 0 1 12.2 4v9.2H4.6A1.2 1.2 0 0 1 3.4 12V2.6z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M12.2 13.2h.8V4.4A1.4 1.4 0 0 0 11.6 3" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/><path d="M5.6 5.2h4.2M5.6 7.4h4.2M5.6 9.6h2.6" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
        <span class="btn-stack-txt" data-i18n="文档">文档</span>
      </button>
      <button type="button" id="btnForum" class="corner mini btn-stack btn-forum" data-i18n-title="MTNode 讨论区：免登录浏览话题与回复；与创意工坊同一账户，登录后可发话题、回帖并改状态" title="MTNode 讨论区：免登录浏览话题与回复；与创意工坊同一账户，登录后可发话题、回帖并改状态" aria-label="讨论区">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 3.4h7.2c.8 0 1.4.6 1.4 1.4v4c0 .8-.6 1.4-1.4 1.4H7.2L4.6 12.6V10.2H3.2c-.8 0-1.4-.6-1.4-1.4v-4c0-.8.6-1.4 1.4-1.4z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M9.4 6.8h3.4c.6 0 1.1.5 1.1 1.1v3.2c0 .6-.5 1.1-1.1 1.1h-.8v1.6L10.4 12.2H9.4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round" opacity=".85"/></svg>
        <span class="btn-stack-txt" data-i18n="讨论">讨论</span>
      </button>
      <button type="button" id="btnApprovals" class="corner mini btn-stack btn-approvals" data-i18n-title="审批与权限：权限预设 / 工具许可 / 识图许可，可随时调整" title="审批与权限：权限预设 / 工具许可 / 识图许可，可随时调整">
        <svg class="btn-stack-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4l5.2 2.2v3.6c0 3.2-2.2 5.2-5.2 6.2-3-1-5.2-3-5.2-6.2V4.6L8 2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.6 8.1l1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-stack-txt" data-i18n="审批">审批</span>
      </button>
      <!-- 顶栏账户入口已启用：当前开「微信扫码登录 / 绑定微信」与「账号密码登录」，
           手机验证码登录 / 绑定手机暂时隐藏；开放哪几种方式由 renderer/app-auth.js 的
           METHOD_ON 单一真源决定（全关时 init 会把 hidden 设回来） -->
      <button type="button" id="btnAccount" class="corner mini btn-stack btn-account" data-i18n-title="账户：登录 / 绑定 / 退出" title="账户：登录 / 绑定 / 退出" aria-label="账户">
        <span class="btn-stack-txt" id="acctName" data-i18n="登录">登录</span>
      </button>
      <button type="button" id="btnUpdate" class="corner mini btn-update" hidden aria-hidden="true" data-i18n-title="发现新版本，点击下载更新" title="发现新版本，点击下载更新">
        <svg class="btn-update-ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.5v8.2M8 9.7l-2.6-2.6M8 9.7l2.6-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 11.5v1.2c0 .7.6 1.3 1.3 1.3h8.4c.7 0 1.3-.6 1.3-1.3v-1.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
        </svg>
        <span class="btn-update-txt" data-i18n="更新">更新</span>
      </button>
      <button type="button" id="btnLang" class="corner mini btn-lang" title="切换为英文" aria-label="切换为英文">
        <svg class="btn-lang-globe" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.35"/>
          <ellipse cx="8" cy="8" rx="2.55" ry="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M1.8 8h12.4M3.1 4.8h9.8M3.1 11.2h9.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span class="btn-lang-badge" id="btnLangBadge">中</span>
      </button>
    </div>
  </div>
  <div class="tb-row tb-row-2 actions">
    <!-- 画布 / 会话 / 专家团：与顶栏其它入口同风格「图标在上 · 文字在下」。
         文字必须留在 span[data-i18n] 上，不能挂在 button[data-i18n] —— I18n.applyDom 对
         [data-i18n] 是 el.textContent = t(key)，挂按钮上会在切语言时把图标一起抹掉。
         图标 14px 比两字标题（25px）窄，所以按钮外框尺寸不变（高度仍 32px、内边距不变）。 -->
    <button id="btnToolWf" class="corner on tb-view" data-shortcut="1" data-i18n-title="AI 画布编排：画布式节点编排" title="AI 画布编排：画布式节点编排">
      <svg class="tb-view-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.9" y="2.4" width="4.8" height="3.8" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="9.3" y="9.8" width="4.8" height="3.8" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M6.7 4.3h3.1a1.5 1.5 0 0 1 1.5 1.5v3.9" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="tb-view-txt" data-i18n="画布">画布</span>
    </button>
    <button id="btnToolAgent" class="corner tb-view" data-shortcut="2" data-i18n-title="智能会话：全屏 agent 会话画布（等于常驻的智能任务）" title="智能会话：全屏 agent 会话画布（等于常驻的智能任务）">
      <svg class="tb-view-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 3.6h9.2c.9 0 1.6.7 1.6 1.6v4.4c0 .9-.7 1.6-1.6 1.6H7.6l-2.9 2.3V11.2H3.4c-.9 0-1.6-.7-1.6-1.6V5.2c0-.9.7-1.6 1.6-1.6z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M8 5.4l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
      <span class="tb-view-txt" data-i18n="会话">会话</span>
    </button>
    <button id="btnTeam" class="corner tb-view" data-shortcut="3" data-i18n-title="专家团：按画布管理专家，与专家对话" title="专家团：按画布管理专家，与专家对话">
      <svg class="tb-view-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.8" cy="5.4" r="2.2" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M1.9 13.2c0-2.2 1.7-3.8 3.9-3.8s3.9 1.6 3.9 3.8" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><path d="M10.8 3.6a2.2 2.2 0 0 1 0 4.3" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><path d="M11.5 9.7c1.6.5 2.6 1.8 2.6 3.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      <span class="tb-view-txt" data-i18n="专家团">专家团</span>
    </button>
    <span class="sep"></span>
    <button id="btnUndo" class="corner mini btn-ico" data-i18n-title="撤销（Ctrl+Z）" data-tip="撤销（Ctrl+Z）" aria-label="撤销">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 6.2h6.2a3.4 3.4 0 1 1 0 6.8H7.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.6 3.6L3 6.2l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-ico-txt" data-i18n="撤销">撤销</span>
    </button>
    <button id="btnRedo" class="corner mini btn-ico" data-i18n-title="重做（Ctrl+Y / Ctrl+Shift+Z）" data-tip="重做（Ctrl+Y / Ctrl+Shift+Z）" aria-label="重做">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.8 6.2H6.6a3.4 3.4 0 1 0 0 6.8H8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10.4 3.6L13 6.2l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-ico-txt" data-i18n="重做">重做</span>
    </button>
    <button id="btnFit" class="corner mini btn-ico" data-shortcut="Space" data-i18n-title="一键居中：缩放并定位到全部节点" data-tip="一键居中：缩放并定位到全部节点" aria-label="居中">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.2V2.5H5.2M10.8 2.5h2.7V5.2M13.5 10.8v2.7H10.8M5.2 13.5H2.5V10.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="5.2" y="5.2" width="5.6" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
      <span class="btn-ico-txt" data-i18n="居中">居中</span>
    </button>
    <button id="btnGroup" class="corner mini btn-ico" data-i18n-title="组：把选中的节点组成一个组（快捷键 G）；选中组后再次点击解散" data-tip="组：把选中的节点组成一个组（快捷键 G）；选中组后再次点击解散" aria-label="组">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="3.2" width="7.2" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-dasharray="2 1.4"/><rect x="6.4" y="7" width="7.2" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span class="btn-ico-txt" data-i18n="组">组</span>
    </button>
    <button id="btnWrapSuper" class="corner mini btn-ico" data-i18n-title="超节点：将选中节点合并为展开的超级节点（覆盖选区范围）" data-tip="超节点：将选中节点合并为展开的超级节点（覆盖选区范围）" aria-label="超节点">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.15" opacity=".85"/><path d="M5.6 8h4.8M8 5.6v4.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="超节点">超节点</span>
    </button>
    <button id="btnAutoLayout" class="corner mini btn-ico" data-i18n-title="一键排版：按连线关系整理节点位置；可选同时排版超级节点内部（可撤销）" data-tip="一键排版：按连线关系整理节点位置；可选同时排版超级节点内部（可撤销）" aria-label="排版">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="2.4" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="9.2" y="2.4" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="2.4" y="9.2" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/><rect x="9.2" y="9.2" width="4.4" height="4.4" rx=".8" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
      <span class="btn-ico-txt" data-i18n="排版">排版</span>
    </button>
    <!-- 查找：等价于 Ctrl+F 的全局搜索浮层（renderer/app-search.js），放在「排版」与「隐藏线」之间 -->
    <button id="btnFind" class="corner mini btn-ico" data-i18n-title="查找（Ctrl+F）：全局搜索画布 / 会话 / 专家团 / 素材库 / 工具库 / 技能 / 模板 / 手册文档" data-tip="查找（Ctrl+F）：全局搜索画布 / 会话 / 专家团 / 素材库 / 工具库 / 技能 / 模板 / 手册文档" aria-label="查找">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.3 10.3l3.3 3.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="查找">查找</span>
    </button>
    <button id="btnHideWires" class="corner mini btn-ico" data-shortcut="D" data-i18n-title="隐藏线：临时把所有连线压到 95% 透明（几乎不可见），排版后看清布局；再次点击恢复" data-tip="隐藏线：临时把所有连线压到 95% 透明（几乎不可见），排版后看清布局；再次点击恢复" aria-label="隐藏线" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 12.4c3.6 0 3.2-8.8 6.8-8.8h4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3 2.8l10.2 10.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="隐藏线">隐藏线</span>
    </button>
    <input id="wfName" class="fn-search tb-wfname" type="text" data-i18n-placeholder="画布名称…" placeholder="画布名称…" style="display:none">
    <span class="sep"></span>
    <button id="btnNewWf" class="corner mini btn-ico" data-i18n-title="新建画布" data-tip="新建画布" aria-label="新建">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="新建">新建</span>
    </button>
    <select id="wfSelect" class="wf-select" data-i18n-title="打开画布" title="打开画布"></select>
    <button id="btnRenameWf" class="corner mini btn-ico" data-i18n-title="更改当前画布名称" data-tip="更改当前画布名称" aria-label="改名">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 3.4l3.2 3.2L5.6 13.6H2.4v-3.2L9.4 3.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.2 4.6l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="改名">改名</span>
    </button>
    <button id="btnImport" class="corner mini btn-ico" data-i18n-title="导入画布：从 .mtnodes 文件恢复完整画布" data-tip="导入画布：从 .mtnodes 文件恢复完整画布" aria-label="导入">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.8v8M5.2 8.2L8 11l2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.2v1.6c0 .7.6 1.2 1.2 1.2h7.6c.7 0 1.2-.5 1.2-1.2v-1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="导入">导入</span>
    </button>
    <button id="btnExport" class="corner mini btn-ico" data-i18n-title="导出画布：把当前画布（含图像等资产）打包为 .mtnodes 文件，可迁移到其他电脑" data-tip="导出画布：把当前画布（含图像等资产）打包为 .mtnodes 文件，可迁移到其他电脑" aria-label="导出">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.8V2.8M5.2 5.4L8 2.6l2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.2v1.6c0 .7.6 1.2 1.2 1.2h7.6c.7 0 1.2-.5 1.2-1.2v-1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="btn-ico-txt" data-i18n="导出">导出</span>
    </button>
    <button id="btnDelWf" class="corner mini btn-ico btn-del-wf" data-i18n-title="删除当前画布" data-tip="删除当前画布" aria-label="删除">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 4.6h9.2M6.2 4.6V3.5h3.6v1.1M5.2 4.6l.6 8h4.4l.6-8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-ico-txt" data-i18n="删除">删除</span>
    </button>
