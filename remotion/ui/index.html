<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remotion</title>
  <!-- 配色 / 按钮 / 输入 / 状态胶囊 / 日志一律取插件控制台共享样式表（plugin-kit）；
       本地 <style> 只留布局（尺寸、间距、栅格）。 -->
  <link rel="stylesheet" href="../../plugins/plugin-kit.css" />
  <style>
    html, body { height: 100%; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
    h1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sub { margin-top: 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* kit 没有「提示条」组件：观感取 --tint-yellow / --yellow 语义令牌，这里只排内边距与圆角 */
    .notice {
      padding: 8px 10px; line-height: 1.45;
      border: 1px solid color-mix(in srgb, var(--yellow) 38%, var(--bd));
      border-radius: var(--r-lg); background: var(--tint-yellow); color: var(--yellow);
    }
    .card { padding: 10px; gap: 8px; }
    .card-log { flex: 1; min-height: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .grid .meta b { font-weight: 600; }
    #console { flex: 1; min-height: 160px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="notice">
      <b>本地渲染</b> · 画布节点渲染时<strong>自动写 src/ 模板 → spawn node render.mjs → 回传进度</strong>。
      渲染前会占用全局音视频互斥锁（同一时刻只允许 1 个音视频任务）。
    </div>
    <div>
      <h1 class="pk-h1">Remotion <span class="pk-pill" id="svcBadge">未安装</span></h1>
      <div class="sub pk-sub">React 驱动的本地视频渲染器（remotion / @remotion/renderer）</div>
    </div>

    <div class="card pk-card">
      <div class="pk-sub">状态</div>
      <div class="grid">
        <!-- 只读运行目录：状态区用它判「运行时检测到 / 未检测到」。安装的一切（选目录 / 安装 /
             进度 / 取消）都不在这只窗里，统一走独立安装窗（plugins/main-install.js）。 -->
        <div class="meta pk-sub">运行目录 <b id="stInstallDir">—</b></div>
        <div class="meta pk-sub">运行时 <b id="stRuntime">—</b></div>
        <div class="meta pk-sub">版本 <b id="stVersion">—</b></div>
        <div class="meta pk-sub">渲染中 <b id="stRendering">否</b></div>
        <div class="meta pk-sub">全局锁 <b id="stLock">空闲</b></div>
      </div>
      <div class="meta pk-sub" id="renderState"></div>
      <!-- 环境自检结论（只在必需项不过时才露头） -->
      <div class="notice" id="selfCheckNotice" hidden></div>
      <div class="row">
        <button class="pk-btn" id="btnSelfCheck" title="只读检查：node / npm、安装目录可写、磁盘余量、npm 源可达性、随包脚手架与安装脚本是否齐全">环境自检</button>
        <button class="pk-btn pk-btn-danger" id="btnClearMeta" title="仅移除数据目录入口，保留运行目录">移除入口</button>
      </div>
    </div>

    <div class="card pk-card card-log">
      <div class="row">
        <div class="pk-sub">Console</div>
        <button class="pk-btn pk-btn-sm" id="btnClearLog" style="margin-left:auto"
          title="清空日志文件（真删除，不只是清显示）">清空日志</button>
      </div>
      <div class="pk-log" id="console"></div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
