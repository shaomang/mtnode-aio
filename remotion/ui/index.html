<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remotion</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6aa6ff;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --danger: #ff6b6b;
      --border: #2a3140;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
      height: 100%;
    }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .sub { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      border: 1px solid var(--border); background: #222836; color: var(--text);
      border-radius: 8px; padding: 7px 12px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: #243552; border-color: #3a5f9a; }
    button.danger { background: #3a2228; border-color: #8a3a45; color: #ffc9c9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .path {
      flex: 1; min-width: 120px; padding: 7px 10px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--border);
      color: var(--muted); word-break: break-all; font-size: 12px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .bar {
      height: 10px; background: #0c0f14; border-radius: 999px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #3a6fd8, #6aa6ff);
      transition: width 0.25s ease;
    }
    .meta { color: var(--muted); font-size: 12px; }
    #console {
      flex: 1; min-height: 160px; overflow: auto; white-space: pre-wrap;
      font: 11px/1.4 ui-monospace, Consolas, monospace;
      background: #0c0f14; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; color: #c5d0e6;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; border: 1px solid var(--border);
    }
    .badge.on { color: var(--ok); border-color: #2f6b4e; }
    .badge.off { color: var(--muted); }
    .badge.work { color: #ffe8a3; border-color: #8a6a1a; background: #3a3018; }
    .notice {
      background: #2a2414; border: 1px solid #6b5418; border-radius: 10px;
      padding: 8px 10px; color: #f0d27a; font-size: 12px; line-height: 1.45;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .grid .meta b { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="notice">
      <b>本地渲染</b> · 先「设置目录 → 安装」完成 remotion 运行时，之后画布节点渲染时会
      <strong>自动写 src/ 模板 → spawn node render.mjs → 回传进度</strong>。渲染前会占用全局音视频互斥锁。
    </div>
    <div>
      <h1>Remotion <span class="badge off" id="svcBadge">未安装</span></h1>
      <div class="sub">React 驱动的本地视频渲染器（remotion / @remotion/renderer）</div>
    </div>

    <div class="card">
      <div class="meta">安装目录</div>
      <div class="row">
        <div class="path" id="installDir">未设置</div>
        <button id="btnDir">设置…</button>
      </div>
      <div class="row">
        <button class="primary" id="btnInstall">安装</button>
        <button id="btnCancelInstall" disabled>取消安装</button>
        <button class="danger" id="btnClearMeta" title="仅移除数据目录入口，保留安装目录">移除入口</button>
      </div>
      <div class="meta" id="installStep">—</div>
      <div class="bar" id="installBar"><i></i></div>
    </div>

    <div class="card">
      <div class="meta">状态</div>
      <div class="grid">
        <div class="meta">运行时 <b id="stRuntime">—</b></div>
        <div class="meta">版本 <b id="stVersion">—</b></div>
        <div class="meta">渲染中 <b id="stRendering">否</b></div>
        <div class="meta">全局锁 <b id="stLock">空闲</b></div>
      </div>
      <div class="meta" id="renderState"></div>
    </div>

    <div class="card" style="flex:1; min-height:0">
      <div class="row">
        <div class="meta">Console</div>
        <button id="btnClearLog" style="margin-left:auto;padding:4px 8px">清空视图</button>
      </div>
      <div id="console"></div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
