# 打包安全（pnpm ≥11 的生效位置；同值也写在 .npmrc 里供老版 pnpm 读）：
# 网关的 node_modules 必须是 npm 式「真实目录」布局。pnpm 默认的 isolated 布局把包做成
# junction/symlink 指向 .pnpm 存储，而 dsh/after-pack.cjs 是手工遍历复制（只搬真实文件）：
# 指向目录的链接会被当文件复制并抛错，resources/dsh/gateway 只复制到一半 —— 安装包启动后
# 网关立刻 exit 1（Cannot find package '@deepseek-ai/dsh-sdk-client'）。
