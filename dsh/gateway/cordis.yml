# MTNode agent runtime: unattended stdio JSON-RPC deployment over the
# published @deepseek-ai/dsh-base 0.1.0-rc.6 spine.
# stdout is reserved for JSON-RPC frames; never add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# 跨进程真续跑（session/resume 桥）：给 SDK server 装一枚可选 JSON-RPC 方法
# session/resume —— 网关在续跑轮真实 prompt 前调用它，把盘上旧会话恢复成 live
# （agents.resume = persistence.prepare 语义）再追加：失败轮进程已不在也能真续跑，
# 不整轮重发白烧。全新会话从不调用该方法 → 上游 create 路径一字不改（降级保底）；
# 老运行时没有该方法 = 网关回退旧 create 语义（同进程续跑照常 / 跨进程回落既有
# collision → RESUME_UNAVAILABLE 转译）。见 dsh/DESIGN.md「断点续跑契约」。
- id: mtnode-session-resume
  name: './plugins/session-resume-server.mjs'

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: typert
  name: '@deepseek-ai/dsh-typert-registry'

- id: typert-loader
  name: '@deepseek-ai/dsh-typert-loader'

- id: typert-gateway
  name: '@deepseek-ai/dsh-api-gateway'

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

# 模型提问工具:模型可在任务中途调用 ask_user_question,经 mtnode-bridge
# 转发到宿主应用弹窗,等待用户回答后继续。
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
  disabled: !!js process.env.MTNODE_CHAT_ISOLATE === '1'

# MTNode 交互桥:注册提问 provider 与审批 answerer,经 localhost TCP 转发给
# gateway(端口由宿主在 spawn 时经 MTNODE_BRIDGE_PORT 注入)。
# BongoChat 仍需桥接审批（联网搜索放行）；仅禁用画布/提问工具。
- id: mtnode-bridge
  name: './bridge-plugin.mjs'

# MTNode 画布工具:模型可在当前工作流中创建/改标题/连线/@引用/自动排版节点。
- id: mtnode-canvas
  name: './canvas-plugin.mjs'
  disabled: !!js process.env.MTNODE_CHAT_ISOLATE === '1' || process.env.MTNODE_PURE === '1'

# MTNode 回滚捕获:在工具 pre/post 观察点采样「改前正文 / 改后指纹」,经同一条桥
# 单向发 journal 帧给 gateway,由主进程落盘成对象库 + 轮次账本(契约见 dsh/DESIGN.md
# 「回滚账本与 journal 帧」)。插件自己不写盘;缺 MTNODE_ROLLBACK_DIR 或
# MTNODE_BRIDGE_PORT 时整体 no-op,行为与未接入时一致。
- id: mtnode-rollback
  name: './rollback-plugin.mjs'
  disabled: !!js process.env.MTNODE_CHAT_ISOLATE === '1' || process.env.MTNODE_PURE === '1'

# MTNode 数据库工具:接入数据库副本节点的任务经 mtnode_db 查询事实
# （list/query/get/calc，只读、确定性检索，宿主按接入关系放行或拒绝）。
- id: mtnode-db
  name: './db-plugin.mjs'
  disabled: !!js process.env.MTNODE_CHAT_ISOLATE === '1' || process.env.MTNODE_PURE === '1'

# MTNode 用户工具节点:把画布中的工具节点 / 库中「随时可调用」的工具注册成
# 会话可见的函数调用工具(func call)。描述子由宿主在每次 run 前经
# MTNODE_TOOLS_JSON 注入(指纹进 runtime key,工具集变化即冷起新运行时);
# 模型发起调用 → 桥帧回宿主执行节点内部图 → 结果回传(失败回错误文本)。
- id: mtnode-tools
  name: './tools-plugin.mjs'
  disabled: !!js process.env.MTNODE_CHAT_ISOLATE === '1' || process.env.MTNODE_PURE === '1'

# 按运行裁剪可见工具集：引擎自带工具（目标 / 任务清单 / 子代理 / 后台任务 / 提问）注册在
# @deepseek-ai 的包里，我们改不到注册，就在 agent 创建窗口用 ctx.tools.restrict({deny})
# 把它们从可见集摘掉（被摘掉的工具整份 schema 不再进请求）。名单 = spawn 时注入的
# MTNODE_HIDE_TOOLS（逗号分隔规范名，同时进 runtime key 的 hx: 指纹 → 一台运行时一个
# 形状，绝不在轮内改可见集）。名单为空 / env 缺席 = 不注册任何监听，行为与未接入时
# 一字不差。MTNode 自有工具的不注册在 canvas-plugin / db-plugin 的注册口，判定的名单
# 真源是 dsh/gateway/tool-visibility.mjs。契约见 dsh/DESIGN.md「按运行裁剪可见工具集」。
- id: mtnode-tool-visibility
  name: './plugins/tool-restrict-plugin.mjs'
  disabled: !!js process.env.MTNODE_PURE === '1'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    path: !!js dshHomePath('settings.yaml')

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# 附件存储:智能任务携带图像时,网关把图像写入 DSH_HOME/attachments/v1
# 的内容寻址对象库,llm-pi-ai 经 attachments.readImage 读取后发给视觉模型。
- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'

# pi-ai 多服务商适配器:休眠挂载,供应商/模型目录见设置(MTNode 服务商自动写入)
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')

- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    # win32 console-flash workaround: noop runner (see gateway.mjs applySandboxWorkaround)
    runnerCommand: ["C:\\nvm4w\\nodejs\\node.exe", "E:\\dev\\tools\\pipeline-console\\dsh\\gateway\\noop-runner.cjs"]
    runnerFailureSignatures: ['noop-runner:']
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'

# Approval policy per session comes from the permission preset below; the
# "ask" presets route requests to the mtnode-bridge answerer (host-app UI).
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      # 智能节点「超级权限 · 询问外部」：沙箱全开，越权/敏感工具走宿主审批；
      # 宿主对工作区内与已授权路径自动放行，外部路径弹窗询问。
      mtnode-super-ask:
        sandbox: danger-full-access
        approval: ask
      bongochat:
        # 桌宠对话：每项工具都走审批，宿主自动放行 web/搜索、拒绝文件/终端/画布
        sandbox: read-only
        approval: ask
      # Default: confinement stays on, asks stay off. The hosting app switches
      # the preset per run (settings 段 + 本行 defaultPreset 双写,见 gateway)。
      mtnode-unattended:
        sandbox: workspace-write
        approval: never
    defaultPreset: mtnode-unattended

